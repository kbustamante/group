<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRUEBA Lácteos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#9a3412">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRUEBA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f7f3ea; --card:#fffdf8; --ink:#1d2433; --muted:#6b7280; --line:#e7e0d0;
  --brand:#1f3a5f; --brand-2:#2c5282; --accent:#f2b705; --accent-ink:#4a3700;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --warn:#a15c00; --warn-bg:#fff1d6; --bad:#b42318; --bad-bg:#fde7e4;
  --local:#2c5282; --mayor:#c27c0e; --r:14px; --shadow:0 1px 2px rgba(29,36,51,.06),0 4px 14px rgba(29,36,51,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
.num,.mono{font-family:"DM Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:19px}
.brand b{display:block;font-size:16px}.brand small{opacity:.75;font-size:12px}
.tasa{margin-left:auto;text-align:right;font-size:12px;opacity:.95}
.tasa b{font-size:15px;display:block}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1100px;margin:10px auto 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#cfdcec;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;font-weight:500}
nav button.on{color:#fff;border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px}.card h3{font-size:14px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.g2.st{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted);font-size:12px;display:block}.kpi b{font-size:21px;font-family:"DM Mono",monospace}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(44,82,130,.15)}
input.num{text-align:right}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.bad{background:#fff;color:var(--bad);border:1px solid #f3c4bd}
.btn.sm{padding:6px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:wait}
.btn.full{width:100%}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-local{background:#e6eef8;color:var(--local)}.p-mayor{background:#fbefd9;color:var(--mayor)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on.local{background:var(--local);color:#fff}.seg button.on.mayor{background:var(--mayor);color:#fff}
.seg button.on.plain{background:var(--brand);color:#fff}
.linea{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.linea .quien{grid-column:1/-1}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}.tot.big{font-size:18px;font-weight:700;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.login{max-width:360px;margin:12vh auto;text-align:center}
.login .logo{width:64px;height:64px;font-size:34px;margin:0 auto 12px;border-radius:18px}
.pin{font-size:28px;letter-spacing:.4em;text-align:center}
#toast{opacity:0;pointer-events:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;transition:.25s;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}#toast.err{background:var(--bad)}
.empty{padding:24px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
.cli{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prodtbl input{padding:7px 8px}.prodtbl td{padding:5px 4px}
.prodtbl tr.has td{background:#fff8e5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:14px}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:2px}
.chip.off{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{border:1px solid #f0dfae;border-radius:12px;padding:10px 12px;background:#fff8e5}
.pcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .flds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.pcard .flds.c3{grid-template-columns:1fr 1fr 1fr}
input.big{font-size:18px;padding:11px 10px}
.chart{position:relative;height:260px}
.hide{display:none!important}
/* que nada empuje la pantalla hacia los lados: las tablas anchas se desplazan dentro de su recuadro */
.grid>*,.card,.kpi{min-width:0}
.tbl{max-width:100%;-webkit-overflow-scrolling:touch}
html,body{max-width:100%;overflow-x:hidden}
@media(max-width:560px){
  main{padding:12px}
  .card{padding:13px}
  th,td{padding:7px 4px}
  td .pill{white-space:normal;line-height:1.25}
  td .num.small,td.small{font-size:11.5px}
  .kpi b{font-size:18px}
  .brand small{display:none}
  .tasa b{font-size:14px}
}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.banner{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.ok{background:var(--ok-bg);color:var(--ok)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ===== Configuración =====
   Si abres esta página desde GitHub Pages, pega aquí la URL de la aplicación web de Apps Script (termina en /exec). */
const API_URL = 'https://script.google.com/macros/s/AKfycbxtmLEtXUAL55bavdg6tDmgFaT1ViHnMEmmknjcFR2HGP730x0rAUg6eBtbelGjDeTG_w/exec';
// Cada app (real / prueba) guarda su usuario y PIN por separado, aunque estén en la misma dirección web.
const NS = 'lac_' + (API_URL ? API_URL.replace(/\/exec$/, '').slice(-10) + '_' : '');

const METODOS = ['Pago móvil', 'Punto de venta', 'Efectivo $', 'Efectivo Bs', 'Zelle', 'Otro'];
const BANCOS = ['Venezuela', 'Provincial', 'Mercantil', 'Banesco', 'Bancamiga', 'Otro'];
const TIPOS = { PDV: 'Punto de venta', PM: 'Pago móvil', EFE: 'Efectivo' };
const LIMITE_USD = 2000; // un cierre en $ mayor a esto probablemente se escribió en bolívares

let PIN = store('pin') || '', USR = store('usr') || '';
let USER = null, S = null, TAB = 'inicio', CHARTS = [];
let CIERRE = null, VENTA = null, COBRO = null, FILTRO = {};

/* ===== Utilidades ===== */
function store(k, v) { try { if (v === undefined) return localStorage.getItem(NS + k); if (v === null) localStorage.removeItem(NS + k); else localStorage.setItem(NS + k, v); } catch (e) { return null; } }
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n2 = n => Number(n || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd = n => '$' + n2(n);
const bs = n => 'Bs ' + n2(n);
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const num = v => { if (typeof v === 'number') return v; v = String(v || '').trim(); if (!v) return 0; if (v.indexOf(',') >= 0) v = v.replace(/\./g, '').replace(',', '.'); return Number(v) || 0; };
const fdate = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(2, 4) : '';
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const mesDe = s => s.slice(0, 7);
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const mesNombre = m => MESES[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3200); }

function call(action, data) {
  const req = { action, usuario: USR, pin: PIN, data: data || {} };
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(r => r && r.ok ? res(r.data) : rej(new Error(r ? r.error : 'Sin respuesta'))).withFailureHandler(rej).api(req));
  }
  if (!API_URL) return Promise.reject(new Error('Falta configurar API_URL en index.html'));
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) })
    .then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error); return r.data; });
}

async function busy(btn, fn) {
  const txt = btn && btn.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); } catch (e) { toast(e.message, true); throw e; } finally { if (btn) { btn.disabled = false; btn.innerHTML = txt; } }
}

function hoy() { return (S && S.hoy) || new Date().toISOString().slice(0, 10); }
function tasaPara(fecha) {
  const t = (S && S.tasas || []).filter(x => x.Fecha <= fecha).sort((a, b) => a.Fecha < b.Fecha ? 1 : -1)[0];
  return t ? Number(t.Tasa) : (S && S.tasaHoy && S.tasaHoy.tasa) || null;
}

/* ===== Arranque ===== */
const CARGANDO = '<div class="login card" style="margin-top:20vh"><div class="logo">🧀</div><p><span class="spin"></span> Cargando…</p><p class="small muted">Trayendo la información del día</p></div>';
async function cargarDatos() {
  if (USER.rol === 'admin') { S = await call('datos'); PROD_CACHE = {}; }
  else if (USER.rol === 'cliente') { S = await call('cliDatos'); S.tasas = []; }
  else { const [t, l] = await Promise.all([call('tasa'), call('local')]); S = Object.assign({ tasaHoy: t, tasas: [] }, l); S.hoy = l.hoy || t.pedido; }
}
async function start() {
  if (!PIN || !USR) return renderLogin();
  $('#app').innerHTML = CARGANDO;
  try {
    USER = await call('login');
    await cargarDatos();
    if (!TABS().some(t => t[0] === TAB)) TAB = TABS()[0][0];
    render();
  } catch (e) {
    if (/PIN|usuario|intentos/i.test(e.message)) { PIN = ''; store('pin', null); }
    renderLogin(e.message);
  }
}
async function recargar() { await cargarDatos(); render(); }

function renderLogin(err) {
  $('#app').innerHTML = `<div class="login card">
    <div class="logo">🧀</div><h2>Ventas Lácteos</h2><p class="muted small">Entra con tu usuario y tu PIN</p>
    <label style="text-align:left">Usuario</label><input id="usr" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(USR)}" placeholder="tu usuario">
    <label style="text-align:left;margin-top:10px">PIN</label><input id="pin" class="pin mono" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">
    ${err ? `<p style="color:var(--bad)" class="small">${esc(err)}</p>` : ''}
    <button class="btn full" style="margin-top:12px" id="entrar">Entrar</button></div>`;
  const go = () => { USR = $('#usr').value.trim().toLowerCase(); PIN = $('#pin').value.trim(); if (!USR || !PIN) return toast('Escribe usuario y PIN', true); store('usr', USR); store('pin', PIN); start(); };
  $('#entrar').onclick = go; $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#usr').onkeydown = e => { if (e.key === 'Enter') $('#pin').focus(); };
  (USR ? $('#pin') : $('#usr')).focus();
}

const TABS_ADMIN = [['inicio', 'Inicio'], ['vender', 'Nueva venta'], ['cobrar', 'Cobrar'], ['pedidos', 'Pedidos'], ['cierre', 'Cierre del día'], ['deudas', 'Deudas'], ['local', 'Local'], ['inventario', 'Inventario'], ['ventas', 'Historial'], ['reportes', 'Reportes'], ['productos', 'Productos'], ['ajustes', 'Ajustes']];
const TABS_LOCAL = [['cierre', 'Cierre del día'], ['mercancia', 'Mercancía']];
const TABS_CLIENTE = [['pedir', 'Hacer pedido'], ['cuentas', 'Mis cuentas'], ['pagar', 'Reportar pago']];
function TABS() { return USER.rol === 'admin' ? TABS_ADMIN : USER.rol === 'cliente' ? TABS_CLIENTE : TABS_LOCAL; }
function pendientesAdmin() { return S.pedidos ? S.pedidos.filter(p => p.Estado === 'Pendiente').length + S.pagosReportados.filter(p => p.Estado === 'Pendiente').length : 0; }

function render() {
  CHARTS.forEach(c => c.destroy()); CHARTS = [];
  const t = S.tasaHoy || {};
  const rolTxt = { admin: 'Administrador', empleado: 'Local', cliente: 'Cliente' }[USER.rol];
  const np = USER.rol === 'admin' ? pendientesAdmin() : 0;
  $('#app').innerHTML = `<header><div class="hrow">
      <div class="logo">🧀</div><div class="brand"><b>${esc(USER.negocio || 'Lácteos')}</b><small>${esc(USER.nombre)} · ${rolTxt}</small></div>
      <div class="tasa">Tasa BCV<b class="mono">${t.tasa ? n2(t.tasa) : '—'}</b>${t.fecha ? fdate(t.fecha) : 'sin tasa'}</div>
    </div><nav>${TABS().map(([k, l]) => `<button data-tab="${k}" class="${TAB === k ? 'on' : ''}">${l}${k === 'pedidos' && np ? ` <span class="badge">${np}</span>` : ''}</button>`).join('')}
      ${USER.rol !== 'admin' ? '<button data-salir>Salir</button>' : ''}</nav></header><main id="main"></main>`;
  document.querySelectorAll('nav [data-tab]').forEach(b => b.onclick = () => { if (TAB !== b.dataset.tab) FILTRO = {}; TAB = b.dataset.tab; render(); });
  const s = document.querySelector('[data-salir]'); if (s) s.onclick = salir;
  ({ inicio: vInicio, vender: vVender, cobrar: vCobrar, deudas: vDeudas, local: vLocal, ventas: vVentas, reportes: vReportes, ajustes: vAjustes, cierre: vCierre, productos: vProductos,
     pedidos: vPedidos, inventario: vInventario, mercancia: vMercancia, pedir: vPedir, cuentas: vCuentas, pagar: vPagar }[TAB] || (() => {}))();
  window.scrollTo(0, 0);
}
function salir() { PIN = ''; store('pin', null); USER = null; S = null; TAB = 'inicio'; renderLogin(); }

/* ===== Cálculos compartidos ===== */
function mismoCliente(nombre, q) { const n = String(nombre || '').toLowerCase().trim(); return n.includes(q) || (n.length >= 4 && q.includes(n)); }
/** Bs de un cierre: si se registró en Bs, los montos exactos que anotó el local; si no, $ × tasa. */
function bsCierre(c, que) {
  const t = tasaCierre(c);
  if (c.Moneda === 'Bs') { const k = ['PDV', 'PM', 'Efectivo'], suf = que === 'Total' ? ['Local', 'Mayor'] : [que]; return suf.reduce((s, x) => s + k.reduce((a, y) => a + Number(c[y + '_' + x] || 0), 0), 0); }
  const usdV = que === 'Total' ? c.Total_USD : que === 'Local' ? c.Total_Local_USD : c.Total_Mayor_USD;
  return t ? Number(usdV) * t : 0;
}
function tasaCierre(c) { return Number(c.Tasa) || tasaPara(c.Fecha); }
/** Agrega datos traídos del historial sin duplicar. */
function mergeS(r) {
  const add = (arr, items, key) => { const have = new Set(arr.map(key)); (items || []).forEach(x => { if (!have.has(key(x))) { arr.push(x); have.add(key(x)); } }); };
  const conDet = new Set(S.detalle.map(d => d.VentaID));
  add(S.ventas, r.ventas, x => x.ID);
  add(S.cobros, r.cobros, x => x.ID);
  add(S.cierres, r.cierres, x => x.ID);
  (r.detalle || []).forEach(d => { if (!conDet.has(d.VentaID)) S.detalle.push(d); });
}
function ventasActivas() { return S.ventas.filter(v => v.Estado !== 'Anulada'); }
function deudasPorCliente() {
  const h = hoy(), m = {};
  ventasActivas().filter(v => Number(v.Saldo) > 0.01).forEach(v => {
    const c = m[v.Cliente] = m[v.Cliente] || { cliente: v.Cliente, saldo: 0, vencido: 0, notas: [], venceMin: '9999' };
    c.saldo += Number(v.Saldo); c.notas.push(v);
    if (v.Vence < h) c.vencido += Number(v.Saldo);
    if (v.Vence < c.venceMin) c.venceMin = v.Vence;
  });
  return Object.values(m).sort((a, b) => b.vencido - a.vencido || b.saldo - a.saldo);
}
function conciliacion(fecha) {
  const mayor = S.cierreLineas.filter(l => l.Fecha === fecha && l.Destino === 'Mayor').reduce((s, l) => s + Number(l.MontoUSD || 0), 0);
  const cob = S.cobros.filter(c => c.Fecha === fecha && String(c.PorLocal).toUpperCase() === 'SI').reduce((s, c) => s + Number(c.MontoUSD || 0), 0);
  return { mayor: r2(mayor), cobros: r2(cob), dif: r2(mayor - cob) };
}
function concPill(c) {
  const tol = S.tolerancia || 1;
  if (!c.mayor && !c.cobros) return '<span class="pill p-local">Sin mayor</span>';
  if (Math.abs(c.dif) <= tol) return '<span class="pill p-ok">Cuadra</span>';
  return `<span class="pill p-bad">${c.dif > 0 ? 'Faltan cobros ' : 'Sobran cobros '}${usd(Math.abs(c.dif))}</span>`;
}

/* ===== INICIO ===== */
function vInicio() {
  const h = hoy(), mes = mesDe(h);
  const deudas = deudasPorCliente();
  const porCobrar = deudas.reduce((s, d) => s + d.saldo, 0), vencido = deudas.reduce((s, d) => s + d.vencido, 0);
  const vm = ventasActivas().filter(v => mesDe(v.Fecha) === mes);
  const ventasMes = vm.reduce((s, v) => s + Number(v.Total), 0), utilMes = vm.reduce((s, v) => s + Number(v.Utilidad), 0);
  const cierreHoy = S.cierres.find(c => c.Fecha === h), cierreAyer = S.cierres.find(c => c.Fecha === addDays(h, -1));
  const dias = [...Array(7)].map((_, i) => addDays(h, -i));
  const avisos = [];

function nuevaVenta() {

  const f = {}; S.detalle.forEach(d => f[d.Codigo] = (f[d.Codigo] || 0) + 1);
  return S.productos.filter(p => String(p.Activo).toUpperCase() !== 'NO').sort((a, b) => (f[b.Codigo] || 0) - (f[a.Codigo] || 0));

    .sort((a, b) => (b.Fecha + String(b.Nota).padStart(6, '0')) > (a.Fecha + String(a.Nota).padStart(6, '0')) ? 1 : -1)[0];
}

  $('#vg').onclick = e => busy(e.target, async () => {
    const lineas = V.lineas.filter(l => num(l.kg) > 0).map(l => ({ codigo: l.codigo, kg: num(l.kg), precio: num(l.precio), costo: num(l.costo) }));
    if (!V.cliente) throw new Error('Elige el cliente');
    if (!lineas.length) throw new Error('Escribe los kilos de al menos un producto');
    const sinStock = lineas.filter(l => l.kg > Number(((S.productos.find(p => p.Codigo === l.codigo) || {}).Stock) || 0) + 0.001);
    if (sinStock.length && S.movimientos && S.movimientos.length && !e.target.dataset.okst) { e.target.dataset.okst = 1; throw new Error('El inventario no alcanza para: ' + sinStock.map(l => nombreProd(l.codigo)).join(', ') + '. Si igual lo despachaste, toca Guardar otra vez.'); }
    const r = await call('guardarVenta', { fecha: V.fecha, cliente: V.cliente, nota: V.nota ? num(V.nota) : null, lineas, notas: V.notas, actualizarPrecios: V.actualizarPrecios, pedidoId: V.pedidoId || '' });
    const c2 = S.clientes.find(c => c.Nombre === V.cliente) || { Nombre: V.cliente, DiasCredito: 7 };
    if ((V.direccion || '') !== (c2.Direccion || '')) await call('guardarCliente', Object.assign({}, c2, { original: V.cliente, Direccion: V.direccion || '' }));
    if (V.pago.activo && num(V.pago.monto) > 0) await call('guardarCobro', cobroPayload(V.pago, V.cliente, V.fecha, r.id));
    toast(`Venta nota ${r.nota} guardada · ${usd(r.total)}`);
    VENTA = null; await recargar();
  });
}

function pagoCampos(P, tasa, px) {

    <div><label>Método</label><select id="${px}m">${METODOS.map(x => `<option ${x === P.metodo ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div><label>Banco</label><select id="${px}b"><option value="">—</option>${BANCOS.map(x => `<option ${x === P.banco ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <div><label>Moneda</label><div class="seg"><button class="${P.moneda === 'Bs' ? 'on plain' : ''}" data-${px}mon="Bs">Bs</button><button class="${P.moneda === 'USD' ? 'on plain' : ''}" data-${px}mon="USD">$</button></div></div>
    <div><label>Monto ${P.moneda === 'Bs' ? 'Bs' : '$'}</label><input id="${px}v" class="num" inputmode="decimal" value="${esc(P.monto)}" placeholder="0,00"></div>
    ${P.moneda === 'Bs' ? `<div><label>Tasa</label><input id="${px}t" class="num" inputmode="decimal" value="${esc(P.tasa || (tasa ? tasa : ''))}"></div><div><label>Equivale</label><div class="num" id="${px}eq" style="padding:10px 0;font-weight:700">${usd(eq)}</div></div>` : '<div></div><div></div>'}
    <div><label>Referencia (opcional)</label><input id="${px}r" value="${esc(P.referencia)}" placeholder="últimos 4"></div>
    <div style="grid-column:span 2"><label>&nbsp;</label><label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="${px}pl" style="width:auto" ${porLocalDe(P) ? 'checked' : ''}> Entró por las cuentas del local (punto o pago móvil del local)</label></div>
  </div>`;
}
function porLocalDe(P) { return P.porLocal != null ? P.porLocal : /móvil|Punto/.test(P.metodo); }
function bindPago(P, px, rer) {
  $('#' + px + 'm').onchange = e => { P.metodo = e.target.value; P.porLocal = null; if (/Efectivo \$|Zelle/.test(P.metodo)) P.moneda = 'USD'; rer(); };
  $('#' + px + 'b').onchange = e => P.banco = e.target.value;
  document.querySelectorAll(`[data-${px}mon]`).forEach(b => b.onclick = () => { P.moneda = b.getAttribute('data-' + px + 'mon'); rer(); });
  const upd = () => { const eqEl = $('#' + px + 'eq'); if (eqEl) { const t = num(P.tasa || ($('#' + px + 't') || {}).value); eqEl.textContent = usd(t ? num(P.monto) / t : 0); } };
  $('#' + px + 'v').oninput = e => { P.monto = e.target.value; upd(); };
  const t = $('#' + px + 't'); if (t) t.oninput = e => { P.tasa = e.target.value; upd(); };
  $('#' + px + 'r').oninput = e => P.referencia = e.target.value;
  $('#' + px + 'pl').onchange = e => P.porLocal = e.target.checked;
}
function cobroPayload(P, cliente, fecha, ventaId) {
  const tasa = P.moneda === 'Bs' ? num(P.tasa || tasaPara(fecha)) : null;
  return { fecha, cliente, ventaId: ventaId || '', metodo: P.metodo, banco: P.banco, referencia: P.referencia, notas: P.notas || '',
    montoBs: P.moneda === 'Bs' ? num(P.monto) : 0, montoUSD: P.moneda === 'USD' ? num(P.monto) : 0, tasa, porLocal: porLocalDe(P) };
}

/* ===== COBRAR ===== */
function nuevoCobro(cliente) { return { fecha: hoy(), cliente: cliente || '', ventaId: '', metodo: 'Pago móvil', banco: 'Venezuela', moneda: 'Bs', monto: '', referencia: '', notas: '' }; }

  if (!COBRO) COBRO = nuevoCobro();

  const saldo = pend.reduce((s, v) => s + Number(v.Saldo), 0);
  const recientes = S.cobros.slice().sort((a, b) => (b.CreadoEn || b.Fecha) > (a.CreadoEn || a.Fecha) ? 1 : -1).slice(0, 25);
  $('#main').innerHTML = `<div class="card">
    <h2>Registrar cobro al mayor</h2>
    <div class="row">
      <div style="flex:2;min-width:200px"><label>Cliente</label><input id="pc" list="dl-cli2" value="${esc(P.cliente)}" placeholder="Escribe o elige"><datalist id="dl-cli2">${deudasPorCliente().map(d => `<option value="${esc(d.cliente)}">${usd(d.saldo)}</option>`).join('')}${S.clientes.map(c => `<option value="${esc(c.Nombre)}">`).join('')}</datalist></div>
      <div><label>Fecha del pago</label><input type="date" id="pf" value="${P.fecha}"></div>
    </div>
    ${P.cliente ? (pend.length ? `<h3>Notas pendientes · debe ${usd(saldo)}</h3><div class="tbl"><table>
      <tr><th></th><th>Nota</th><th>Fecha</th><th>Vence</th><th class="r">Saldo</th></tr>
      <tr><td><input type="radio" name="pv" value="" ${!P.ventaId ? 'checked' : ''} style="width:auto"></td><td colspan="4"><b>Aplicar a las más viejas primero</b></td></tr>
      ${pend.map(v => `<tr><td><input type="radio" name="pv" value="${v.ID}" ${P.ventaId === v.ID ? 'checked' : ''} style="width:auto"></td><td>${esc(v.Nota || '-')}</td><td>${fdate(v.Fecha)}</td><td>${v.Vence < hoy() ? `<span class="pill p-bad">${fdate(v.Vence)}</span>` : fdate(v.Vence)}</td><td class="r num">${usd(v.Saldo)}</td></tr>`).join('')}
      </table></div>` : '<p class="small muted">Este cliente no tiene deudas; el pago quedará como saldo a favor.</p>') : ''}
    ${pagoCampos(P, tasa, 'pp')}

    <button class="btn acc full" style="margin-top:14px" id="pg">Guardar cobro</button>
  </div>
  <div class="card"><h2>Últimos cobros</h2><div class="tbl"><table>
    <tr><th>Fecha</th><th>Cliente</th><th>Método</th><th class="r">Bs</th><th class="r">$</th><th></th><th></th></tr>
    ${recientes.map(c => `<tr><td>${fdate(c.Fecha)}</td><td>${esc(c.Cliente)}</td><td class="small">${esc(c.Metodo)}${c.Banco ? ' · ' + esc(c.Banco) : ''}</td><td class="r num small">${c.MontoBs ? n2(c.MontoBs) : ''}</td><td class="r num">${usd(c.MontoUSD)}</td><td>${String(c.PorLocal).toUpperCase() === 'SI' ? '<span class="pill p-mayor" title="Entró por cuentas del local">Local</span>' : ''}</td><td><button class="x" data-dc="${c.ID}" title="Eliminar">×</button></td></tr>`).join('')}
  </table></div></div>`;
  $('#pc').onchange = e => { P.cliente = e.target.value.trim(); P.ventaId = ''; setTimeout(vCobrar); };
  $('#pf').onchange = e => { P.fecha = e.target.value; P.tasa = ''; vCobrar(); };
  $('#pn').oninput = e => P.notas = e.target.value;
  document.querySelectorAll('[name=pv]').forEach(r => r.onchange = () => P.ventaId = r.value);
  bindPago(P, 'pp', vCobrar);
  $('#pg').onclick = e => busy(e.target, async () => {
    if (!P.cliente) throw new Error('Elige el cliente');
    if (!(num(P.monto) > 0)) throw new Error('Escribe el monto');
    const r = await call('guardarCobro', cobroPayload(P, P.cliente, P.fecha, P.ventaId));
    toast('Cobro guardado' + (r.aplicado.length > 1 ? ` · repartido en ${r.aplicado.length} notas` : ''));
    COBRO = nuevoCobro(); await recargar();
  });
  document.querySelectorAll('[data-dc]').forEach(b => b.onclick = () => { if (confirmar(b, '¿Seguro?')) busy(b, async () => { await call('eliminarCobro', { id: b.dataset.dc }); toast('Cobro eliminado'); await recargar(); }); });
}
function confirmar(btn, txt) { if (btn.dataset.ok) return true; btn.dataset.ok = 1; const o = btn.innerHTML; btn.innerHTML = txt; btn.style.color = 'var(--bad)'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.ok; btn.innerHTML = o; btn.style.color = ''; } }, 2500); return false; }

}

  S.mesesCargados = S.mesesCargados || {};
  const mes = FILTRO.mes || meses[0] || mesDe(hoy());
  const vm = ventasActivas().filter(v => mesDe(v.Fecha) === mes), ids = new Set(vm.map(v => v.ID));
  const tot = vm.reduce((s, v) => s + Number(v.Total), 0), uti = vm.reduce((s, v) => s + Number(v.Utilidad), 0);
  const cob = S.cobros.filter(c => mesDe(c.Fecha) === mes).reduce((s, c) => s + Number(c.MontoUSD), 0);
  const local = S.cierres.filter(c => mesDe(c.Fecha) === mes).reduce((s, c) => s + Number(c.Total_Local_USD), 0);
  const prod = {}; S.detalle.filter(d => ids.has(d.VentaID)).forEach(d => { const p = prod[d.Producto] = prod[d.Producto] || { kg: 0, v: 0, u: 0 }; p.kg += Number(d.Kg); p.v += Number(d.Subtotal); p.u += Number(d.Utilidad); });
  const kg = Object.values(prod).reduce((s, p) => s + p.kg, 0);
  const cli = {}; vm.forEach(v => { const c = cli[v.Cliente] = cli[v.Cliente] || { n: 0, v: 0, u: 0 }; c.n++; c.v += Number(v.Total); c.u += Number(v.Utilidad); });
  const ult12 = [...new Set(ventasActivas().map(v => mesDe(v.Fecha)))].sort().slice(-12);
  $('#main').innerHTML = `<div class="row" style="margin-bottom:12px"><div style="max-width:220px"><label>Mes</label><select id="rm">${meses.map(m => `<option value="${m}" ${m === mes ? 'selected' : ''}>${mesNombre(m)}</option>`).join('')}</select></div></div>
    <div class="grid g4" style="margin-bottom:14px">
      <div class="kpi"><small>Ventas al mayor</small><b>${usd(tot)}</b></div>
      <div class="kpi ok"><small>Utilidad · ${tot ? Math.round(uti / tot * 100) : 0}%</small><b>${usd(uti)}</b></div>
      <div class="kpi"><small>Kilos vendidos</small><b>${n2(kg)}</b></div>
      <div class="kpi"><small>Cobrado en el mes</small><b>${usd(cob)}</b></div>
      <div class="kpi"><small>Ventas del local</small><b>${usd(local)}</b></div>
      <div class="kpi"><small>Notas emitidas</small><b>${vm.length}</b></div>
      <div class="kpi"><small>Clientes atendidos</small><b>${Object.keys(cli).length}</b></div>
      <div class="kpi"><small>Venta promedio</small><b>${usd(vm.length ? tot / vm.length : 0)}</b></div>
    </div>
    <div class="card"><h2>Ventas y utilidad por mes</h2><div class="chart"><canvas id="ch1"></canvas></div></div>
    <div class="grid g2 st">
      <div class="card"><h2>Por producto</h2><div class="tbl"><table><tr><th>Producto</th><th class="r">Kg</th><th class="r">Ventas</th><th class="r">Utilidad</th></tr>
        ${Object.entries(prod).sort((a, b) => b[1].v - a[1].v).map(([n, p]) => `<tr><td>${esc(n)}</td><td class="r num">${n2(p.kg)}</td><td class="r num">${usd(p.v)}</td><td class="r num" style="color:var(--ok)">${usd(p.u)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin ventas</td></tr>'}</table></div></div>
      <div class="card"><h2>Mejores clientes</h2><div class="tbl"><table><tr><th>Cliente</th><th class="r">Notas</th><th class="r">Ventas</th><th class="r">Utilidad</th></tr>
        ${Object.entries(cli).sort((a, b) => b[1].v - a[1].v).slice(0, 15).map(([n, c]) => `<tr><td>${esc(n)}</td><td class="r num">${c.n}</td><td class="r num">${usd(c.v)}</td><td class="r num" style="color:var(--ok)">${usd(c.u)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin ventas</td></tr>'}</table></div></div>
    </div>`;
  $('#rm').onchange = async e => {
    FILTRO.mes = e.target.value;
    if (S.corte && FILTRO.mes + '-31' < S.corte && !S.mesesCargados[FILTRO.mes]) {
      $('#rm').disabled = true; toast('Trayendo ' + mesNombre(FILTRO.mes) + ' del historial…');
      try { mergeS(await call('historial', { mes: FILTRO.mes })); S.mesesCargados[FILTRO.mes] = 1; } catch (err) { toast(err.message, true); }
    }
    vReportes();

    CHARTS.push(new Chart($('#ch1'), { type: 'bar', data: { labels: ult12.map(mesNombre), datasets: [
      { label: 'Ventas al mayor', data: serie('Total'), backgroundColor: '#2c5282', borderRadius: 4 },
      { label: 'Utilidad', data: serie('Utilidad'), backgroundColor: '#1a7f4b', borderRadius: 4 },
      { label: 'Local', data: loc, backgroundColor: '#f2b705', borderRadius: 4 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => c.dataset.label + ': ' + usd(c.raw) } } }, scales: { y: { ticks: { callback: v => '$' + v } }, x: { grid: { display: false } } } } }));

}

function precioCon(costo, margen) { return margen < 1 ? costo / (1 - margen) : 0; }
const pct = m => (Math.round(m * 1000) / 10).toLocaleString('es-VE') + '%';

}
function invStock() {

  const bajos = prods.filter(p => Number(p.Minimo) > 0 && Number(p.Stock) < Number(p.Minimo));
  const sinConteo = !S.movimientos.some(m => m.Tipo === 'Inventario inicial') && prods.every(p => !Number(p.Stock));
  $('#inv').innerHTML = `${sinConteo ? '<div class="banner warn">📦 Todavía no hay inventario cargado. Empieza por <b>Conteo</b>: pesa lo que hay y escribe los kg de cada producto.</div>' : ''}

    </table></div></div>
    <div class="card" style="grid-column:1/-1"><h2>Usuarios</h2>
      <p class="small muted" style="margin-top:-6px">Cada persona entra con su usuario (único) y su PIN (4 a 8 números). Rol: admin (todo), empleado (cierre y mercancía del local) o cliente (sus pedidos y su cuenta). Para un cliente, elige a qué cliente corresponde. Deja el PIN vacío para no cambiarlo.</p>
      <div class="tbl"><table id="utab"></table></div></div>
    <div class="card" style="grid-column:1/-1"><h2>Clientes</h2><input id="cq" placeholder="Buscar cliente" style="margin-bottom:8px">
      <div class="tbl" style="max-height:380px;overflow:auto"><table id="ctab"></table></div></div>
    <div class="card"><h2>Alertas y cuenta</h2>
      <p class="small muted">Todos los días a las 7 a.m. llega un correo a los administradores que tengan correo en Usuarios: deudas vencidas, cierre faltante, conciliación, inventario bajo, pedidos por confirmar y pagos a proveedores por vencer. Los pedidos y pagos de clientes avisan al momento.</p>
      <div class="row"><button class="btn sec" id="al">Enviar resumen ahora</button><button class="btn bad" id="lo">Cerrar sesión</button></div></div>
  </div>`;
  $('#tg').onclick = e => busy(e.target, async () => { await call('guardarTasa', { fecha: $('#tf').value, tasa: num($('#tv').value) }); toast('Tasa guardada'); await recargar(); });
  $('#tb').onclick = e => busy(e.target, async () => { const r = await call('buscarTasa'); toast(r.sinCambio ? 'Hay una tasa manual para ese día; se mantiene' : 'Tasa BCV: ' + n2(r.tasa)); await recargar(); });
  const codDe = t => { t = t.trim(); const p = S.productos.find(x => x.Nombre.toLowerCase() === t.toLowerCase() || x.Codigo === t.toUpperCase()); return p ? p.Codigo : t; };
  document.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => busy(b, async () => { const c = b.dataset.ps; await call('guardarProducto', { Codigo: c, Nombre: $(`[data-pn="${c}"]`).value, Costo: num($(`[data-pc="${c}"]`).value), Precio: num($(`[data-pp="${c}"]`).value),
    Margen: $(`[data-pm="${c}"]`).value === '' ? '' : num($(`[data-pm="${c}"]`).value) / 100, Minimo: num($(`[data-pmin="${c}"]`).value), Sustitutos: $(`[data-psu="${c}"]`).value.split(',').map(codDe).filter(Boolean).join(',') }); toast('Producto actualizado'); await recargar(); }));
  const pintarUs = () => {
    const rows = S.usuarios.concat([{ nuevo: true, Nombre: '', Usuario: '', Rol: 'empleado', Email: '', Activo: 'SI', Cliente: '' }]);
    $('#utab').innerHTML = '<tr><th>Nombre</th><th>Usuario</th><th>PIN</th><th>Rol</th><th>Cliente</th><th>Correo</th><th>Activo</th><th></th></tr>' + rows.map((u, i) => `<tr>
      <td><input data-un="${i}" value="${esc(u.Nombre)}" placeholder="${u.nuevo ? 'Nuevo usuario' : ''}" style="min-width:110px"></td><td><input data-uu="${i}" value="${esc(u.Usuario)}" autocapitalize="none" style="min-width:90px"></td>
      <td><input data-up="${i}" class="mono" inputmode="numeric" maxlength="8" placeholder="${u.nuevo ? 'PIN' : '••••'}" style="width:80px"></td>
      <td><select data-ur="${i}" style="min-width:112px">${['admin', 'empleado', 'cliente'].map(r => `<option ${String(u.Rol).toLowerCase() === r ? 'selected' : ''}>${r}</option>`).join('')}</select></td>
      <td><input data-uc="${i}" list="dl-cli3" value="${esc(u.Cliente)}" style="min-width:150px"></td><td><input data-ue="${i}" value="${esc(u.Email)}" style="min-width:150px"></td>
      <td><select data-ua="${i}" style="min-width:70px"><option ${String(u.Activo).toUpperCase() !== 'NO' ? 'selected' : ''}>SI</option><option ${String(u.Activo).toUpperCase() === 'NO' ? 'selected' : ''}>NO</option></select></td>
      <td><button class="btn sm ${u.nuevo ? '' : 'sec'}" data-ug="${i}" data-orig="${esc(u.Usuario || '')}">${u.nuevo ? '+' : '✓'}</button></td></tr>`).join('') + `<datalist id="dl-cli3">${S.clientes.map(c => `<option value="${esc(c.Nombre)}">`).join('')}</datalist>`;
    document.querySelectorAll('[data-ug]').forEach(b => b.onclick = () => busy(b, async () => { const i = b.dataset.ug, v = k => $(`[data-${k}="${i}"]`).value;
      const propio = b.dataset.orig && b.dataset.orig === USR, nuevoPin = v('up').trim();
      await call('guardarUsuario', { original: b.dataset.orig, Nombre: v('un'), Usuario: v('uu'), PIN: nuevoPin, Rol: v('ur'), Cliente: v('uc'), Email: v('ue'), Activo: v('ua') });
      if (propio) { if (nuevoPin) { PIN = nuevoPin; store('pin', PIN); } USR = v('uu').trim().toLowerCase(); store('usr', USR); } // tu propio usuario: la app sigue entrando con el PIN nuevo
      toast(propio && nuevoPin ? 'Tu PIN quedó cambiado' : 'Usuario guardado'); await recargar(); TAB = 'ajustes'; render(); }));
  };
  pintarUs();
  $('#npg').onclick = e => busy(e.target, async () => { const n = $('#npn').value.trim(); if (!n) throw new Error('Escribe el nombre'); const cod = n.normalize('NFD').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() + (S.productos.length + 1); await call('guardarProducto', { Codigo: cod, Nombre: n, Costo: num($('#npc').value), Precio: num($('#npp').value) }); toast('Producto agregado'); VENTA = null; await recargar(); });
  const pintarCli = () => { const q = $('#cq').value.toLowerCase(); $('#ctab').innerHTML = '<tr><th>Nombre</th><th>Teléfono</th><th>Dirección</th><th>Zona</th><th class="r">Días</th><th></th></tr>' + S.clientes.filter(c => !q || String(c.Nombre).toLowerCase().includes(q)).map((c, i) => `<tr><td><input value="${esc(c.Nombre)}" data-cn="${i}" style="min-width:200px"></td><td><input value="${esc(c.Telefono)}" data-ct="${i}" inputmode="tel" style="min-width:110px"></td><td><input value="${esc(c.Direccion || '')}" data-cdir="${i}" style="min-width:160px"></td><td><input value="${esc(c.Zona)}" data-cz="${i}"></td><td><input class="num" style="width:56px" value="${esc(c.DiasCredito)}" data-cd="${i}"></td><td><button class="btn sm sec" data-cs="${i}" data-orig="${esc(c.Nombre)}">✓</button></td></tr>`).join('');
    document.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => busy(b, async () => { const i = b.dataset.cs; await call('guardarCliente', { original: b.dataset.orig, Nombre: $(`[data-cn="${i}"]`).value.trim(), Telefono: $(`[data-ct="${i}"]`).value, Zona: $(`[data-cz="${i}"]`).value, Direccion: $(`[data-cdir="${i}"]`).value, DiasCredito: num($(`[data-cd="${i}"]`).value) }); toast('Cliente guardado'); await recargar(); })); };
  $('#cq').oninput = pintarCli; pintarCli();
  $('#al').onclick = e => busy(e.target, async () => { const r = await call('enviarAlertas'); toast(r.enviado ? 'Correo enviado a ' + r.para.join(', ') : r.motivo, !r.enviado); });
  $('#lo').onclick = salir;
}

start();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/googleusercontent|script\.google/.test(location.host)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
