*{box-sizing:border-box}

main{max-width:1100px;margin:0 auto;padding:16px}

<script>
/* ===== Configuración =====
   Si abres esta página desde GitHub Pages, pega aquí la URL de la aplicación web de Apps Script (termina en /exec). */
const API_URL = 'https://script.google.com/macros/s/AKfycbxtmLEtXUAL55bavdg6tDmgFaT1ViHnMEmmknjcFR2HGP730x0rAUg6eBtbelGjDeTG_w/exec';
const PANTALLA = 'V12'; // versión de esta pantalla (sirve para saber si el celular ya bajó la última)
// Cada app (real / prueba) guarda su usuario y PIN por separado, aunque estén en la misma dirección web.
const NS = 'lac_' + (API_URL ? API_URL.replace(/\/exec$/, '').slice(-10) + '_' : '');

const METODOS = ['Pago móvil', 'Punto de venta', 'Efectivo $', 'Efectivo Bs', 'Zelle', 'Otro'];
const BANCOS = ['Venezuela', 'Provincial', 'Mercantil', 'Banesco', 'Bancamiga', 'Otro'];
const TIPOS = { PDV: 'Punto de venta', PM: 'Pago móvil', EFE: 'Efectivo' };

let PIN = store('pin') || '', USR = store('usr') || '', TOKEN = store('tok') || ''; // V12: se guarda el pase de la sesión, no el PIN

function store(k, v) { try { if (v === undefined) return localStorage.getItem(NS + k); if (v === null) localStorage.removeItem(NS + k); else localStorage.setItem(NS + k, v); } catch (e) { return null; } }

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3200); }

function call(action, data, conPin) {
  const req = TOKEN && !conPin ? { action, token: TOKEN, data: data || {} } : { action, usuario: USR, pin: PIN, data: data || {} };
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(r => r && r.ok ? res(r.data) : rej(new Error(r ? r.error : 'Sin respuesta'))).withFailureHandler(rej).api(req));
  }
  if (!API_URL) return Promise.reject(new Error('Falta configurar API_URL en index.html'));
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) })
    .then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error); return r.data; });
}

async function busy(btn, fn) {
  const txt = btn && btn.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); } catch (e) { toast(e.message, true); throw e; } finally { if (btn) { btn.disabled = false; btn.innerHTML = txt; } }
}

function hoy() { return (S && S.hoy) || new Date().toISOString().slice(0, 10); }
function tasaPara(fecha) {
  const t = (S && S.tasas || []).filter(x => x.Fecha <= fecha).sort((a, b) => a.Fecha < b.Fecha ? 1 : -1)[0];
  return t ? Number(t.Tasa) : (S && S.tasaHoy && S.tasaHoy.tasa) || null;
}

/* V12: abrir rápido. Lo último que se vio hoy se muestra al instante SOLO PARA MIRAR (botones bloqueados) mientras llegan los datos frescos. */
function guardarVista() { try { if (!USER || !S) return; const j = JSON.stringify({ d: hoy(), t: Date.now(), u: USER, s: S }); if (j.length < 4e6) localStorage.setItem(NS + 'vista', j); } catch (e) { borrarVista(); } }
function leerVista() { try { const v = JSON.parse(localStorage.getItem(NS + 'vista') || 'null'); return v && v.u && v.u.usuario === USR && v.d === new Date().toLocaleDateString('en-CA') ? v : null; } catch (e) { return null; } }
function borrarVista() { try { localStorage.removeItem(NS + 'vista'); } catch (e) {} }
function aplicarEntrada(r) {
  if (r.token) { TOKEN = r.token; store('tok', TOKEN); }
  PIN = ''; store('pin', null); // el PIN ya no queda guardado en el teléfono
  USER = r.usuario; S = r.datos || {};
  if (AL()) { PROD_CACHE = {}; USER.funciones = S.funciones || USER.funciones; }
  else if (USER.rol === 'cliente') S.tasas = [];
  else { S.tasas = S.tasas || []; S.hoy = S.hoy || hoy(); }
}
async function start() {
  if (!TOKEN && !(PIN && USR)) return renderLogin();
  const v = TOKEN && leerVista();
  if (v) { USER = v.u; S = v.s; SOLO_VER = true; if (!TABS().some(t => t[0] === TAB)) TAB = TABS()[0][0]; render(); }
  else $('#app').innerHTML = CARGANDO;
  cargarChart();
  try {
    try { aplicarEntrada(await call('entrar', {}, !TOKEN)); }
    catch (e1) { if (!/desconocida/i.test(e1.message)) throw e1; USER = await call('login', {}, true); await cargarDatos(); } // servidor todavía en V11
    SOLO_VER = false;
    if (!TABS().some(t => t[0] === TAB)) TAB = TABS()[0][0];
    render(); guardarVista(); avisoPrivacidad();
  } catch (e) {
    SOLO_VER = false; quitarVelo();
    if (/PIN|usuario|intentos|sesión|venci/i.test(e.message)) { PIN = ''; store('pin', null); TOKEN = ''; store('tok', null); borrarVista(); USER = null; S = null; renderLogin(e.message); }
    else if (v) toast('Sin conexión: estás viendo lo guardado. ' + e.message, true);

}

/* ===== Cálculos compartidos ===== */
function mismoCliente(nombre, q) { const n = String(nombre || '').toLowerCase().trim(); return n.includes(q) || (n.length >= 4 && q.includes(n)); }
/** Bs de un cierre: si se registró en Bs, los montos exactos que anotó el local; si no, $ × tasa. */
function bsCierre(c, que) {
  const t = tasaCierre(c);
  if (c.Moneda === 'Bs') { // montos exactos que anotó el local; lo del mayor sale de lo que marcó o de los cobros
    const crudo = suf => ['PDV', 'PM', 'Efectivo'].reduce((a, y) => a + Number(c[y + '_' + suf] || 0), 0), tot = crudo('Local') + crudo('Mayor'), k = conciliacion(c.Fecha);
    const may = k.mayor >= k.cobros ? crudo('Mayor') : mayorDia(c) * (t || 0);
    return que === 'Total' ? tot : que === 'Mayor' ? may : tot - may; }
  const usdV = que === 'Total' ? c.Total_USD : que === 'Local' ? localNeto(c) : mayorDia(c);
  return t ? Number(usdV) * t : 0;
}
/** Lo que fue de clientes al mayor ese día: lo que marcó el local (cierres viejos) o los cobros "entró por las cuentas del local", lo mayor. */
function mayorDia(c) { const k = conciliacion(c.Fecha); return r2(Math.max(k.mayor, k.cobros)); }

function localNeto(c) { return r2(Number(c.Total_USD) - mayorDia(c)); }
function tasaCierre(c) { return Number(c.Tasa) || tasaPara(c.Fecha); }
/** Agrega datos traídos del historial sin duplicar. */
function mergeS(r) {
  const add = (arr, items, key) => { const have = new Set(arr.map(key)); (items || []).forEach(x => { if (!have.has(key(x))) { arr.push(x); have.add(key(x)); } }); };
  const conDet = new Set(S.detalle.map(d => d.VentaID));
  add(S.ventas, r.ventas, x => x.ID);
  add(S.cobros, r.cobros, x => x.ID);
  add(S.cierres, r.cierres, x => x.ID);
  if (r.cierreLineas && S.cierreLineas) { const ya = new Set(S.cierreLineas.map(l => l.CierreID)); r.cierreLineas.forEach(l => { if (!ya.has(l.CierreID)) S.cierreLineas.push(l); }); }
  (r.detalle || []).forEach(d => { if (!conDet.has(d.VentaID)) S.detalle.push(d); });
  if (r.gastos && S.gastos) add(S.gastos, r.gastos, x => x.ID);

function ventasActivas() { return S.ventas.filter(v => v.Estado !== 'Anulada'); }
function deudasPorCliente() {
  const h = hoy(), m = {};
  ventasActivas().filter(v => Number(v.Saldo) > 0.01).forEach(v => {
    const c = m[v.Cliente] = m[v.Cliente] || { cliente: v.Cliente, saldo: 0, vencido: 0, notas: [], venceMin: '9999' };
    c.saldo += Number(v.Saldo); c.notas.push(v);

    if (v.Vence < c.venceMin) c.venceMin = v.Vence;

  return Object.values(m).sort((a, b) => b.vencido - a.vencido || b.saldo - a.saldo);

function conciliacion(fecha) {
  const mayor = S.cierreLineas.filter(l => l.Fecha === fecha && l.Destino === 'Mayor').reduce((s, l) => s + Number(l.MontoUSD || 0), 0);
  const cob = S.cobros.filter(c => c.Fecha === fecha && String(c.PorLocal).toUpperCase() === 'SI').reduce((s, c) => s + Number(c.MontoUSD || 0), 0);
  return { mayor: r2(mayor), cobros: r2(cob), dif: mayor > 0.005 ? r2(mayor - cob) : 0 }; // desde la V9 el local ya no marca "Mayor": solo se compara en los cierres viejos
}
function concPill(c) {

  if (!c.mayor) return `<span class="pill p-mayor" title="Cobros a clientes al mayor que entraron por las cuentas del local">Mayor ${usd(c.cobros)}</span>`;
  if (Math.abs(c.dif) <= tol) return '<span class="pill p-ok">Cuadra</span>';
  return `<span class="pill p-bad">${c.dif > 0 ? 'Faltan' : 'Sobran'}<span class="hm"> cobros</span> ${usd(Math.abs(c.dif))}</span>`;
}

/* ===== CIERRE DEL LOCAL ===== */
function nuevoCierre() {
  return { fecha: hoy(), moneda: 'USD', notas: '', lineas: [{ tipo: 'PDV', destino: 'Local', monto: '' }, { tipo: 'PM', destino: 'Local', monto: '' }] };
}
function vCierre() {
  if (!CIERRE) CIERRE = nuevoCierre();
  const C = CIERRE, tasa = tasaPara(C.fecha) || (S.tasaHoy && S.tasaHoy.tasa);
  const toU = m => C.moneda === 'Bs' ? (tasa ? num(m) / tasa : 0) : num(m);

    <div class="row">

      <div><label>Montos en</label><div class="seg"><button class="${C.moneda === 'USD' ? 'on plain' : ''}" data-mon="USD">Dólares $</button><button class="${C.moneda === 'Bs' ? 'on plain' : ''}" data-mon="Bs">Bolívares</button></div></div>

      <div class="tot big"><span>Total del día</span><span class="num">${sym(lo)}</span></div>

        <button class="btn sm" id="cabs" style="margin-top:8px;display:block">Son bolívares: cambiar</button></div>` : ''}

        <div class="tot" style="padding:2px 0"><span>Total</span><b class="num">${otra(lo)}</b></div></div>` : ''}`;
  };
  const pinta = () => { pintarTot(); const cb = $('#cabs'); if (cb) cb.onclick = () => { C.moneda = 'Bs'; rer(); }; };
  pinta();

    CIERRE = null;
    if (AL() && puedeVer('local')) { TAB = 'local'; await recargar(); }
    else $('#main').innerHTML = `<div class="card login" style="margin-top:8vh"><div class="logo" style="background:var(--ok-bg)">✅</div><h2>Cierre del ${fdate(r.fecha)} guardado</h2><p class="muted">Si te equivocaste, vuelve a registrarlo y se reemplaza.</p><button class="btn sec full" id="otro">Registrar de nuevo</button></div>`, $('#otro').onclick = () => vCierre();
  });
  // aviso si ya existe
  call('cierreDelDia', { fecha: C.fecha }).then(r => { const a = $('#aviso'); if (a && r && r.existe) a.innerHTML = `<div class="banner warn">Ya hay un cierre para este día${r.empleado ? ' (de ' + esc(r.empleado) + ')' : ''}. Si guardas, se reemplaza.</div>`; }).catch(() => {});
}

/* ===== VENDER ===== */
function nuevaVenta() {
  return { fecha: hoy(), cliente: '', nota: '', notas: '', lineas: [], verCostos: false, verOtros: false, actualizarPrecios: false, direccion: null, buscando: false,
    pago: { activo: false, metodo: 'Pago móvil', banco: 'Venezuela', moneda: 'Bs', monto: '', referencia: '' } };
}
function siguienteNota() { return S.ventas.filter(v => Number(v.Nota) > 0).sort((a, b) => a.Fecha < b.Fecha ? 1 : -1).slice(0, 20).reduce((m, v) => Math.max(m, Number(v.Nota)), 0) + 1; }
function productosPorUso() {
  const f = {}; S.detalle.forEach(d => f[d.Codigo] = (f[d.Codigo] || 0) + 1);
  return S.productos.filter(p => String(p.Activo).toUpperCase() !== 'NO').sort((a, b) => (f[b.Codigo] || 0) - (f[a.Codigo] || 0));
}
function ultimaVenta(cliente) {
  return S.ventas.filter(v => v.Cliente === cliente && v.Estado !== 'Anulada' && S.detalle.some(d => d.VentaID === v.ID))
    .sort((a, b) => (b.Fecha + String(b.Nota).padStart(6, '0')) > (a.Fecha + String(a.Nota).padStart(6, '0')) ? 1 : -1)[0];
}
function agregarLinea(V, codigo, kg, previo) {
  if (V.lineas.some(l => l.codigo === codigo)) return;
  const p = S.productos.find(x => x.Codigo === codigo) || {};
  V.lineas.push({ codigo, nombre: p.Nombre || codigo, kg: kg == null ? '' : String(kg), precio: String(Number(p.Precio) || ''), costo: String(Number(p.Costo) || ''), previo: previo || null });
}
function vVender() {

  $('#main').innerHTML = `<div class="card">

    <div class="row">
      <div style="flex:2;min-width:200px"><label>Cliente</label><input id="vc" list="dl-cli" value="${esc(V.cliente)}" placeholder="Escribe o elige" autocomplete="off"><datalist id="dl-cli">${S.clientes.filter(c => String(c.Activo).toUpperCase() !== 'NO').map(c => `<option value="${esc(c.Nombre)}">`).join('')}</datalist></div>
      <div><label>Fecha</label><input type="date" id="vf" value="${V.fecha}"></div>
      <div><label>N° nota (talonario)</label><input id="vn" class="num" inputmode="numeric" value="${esc(V.nota)}" placeholder="${siguienteNota()}"></div>

    ${V.cliente ? `<div style="margin-top:10px"><label>Dirección (opcional)</label><input id="vdir" value="${esc(V.direccion || '')}" placeholder="Dirección de entrega"></div>` : ''}
    ${deuda ? `<p class="small">Este cliente debe <b class="num">${usd(deuda.saldo)}</b>${deuda.vencido ? ` (<b style="color:var(--bad)">${usd(deuda.vencido)} vencido</b>)` : ''}.</p>` : ''}
    ${V.cliente && cli ? `<div style="margin-top:10px">${ult ? `<button class="btn sec full" id="vrep">↻ Repetir último pedido · nota ${esc(ult.Nota || '-')} del ${fdate(ult.Fecha)} (${usd(ult.Total)})</button>`
      : `<button class="btn sec full" id="vbus">${V.buscando ? '<span class="spin"></span>' : '↻ Buscar su último pedido en el historial'}</button>`}</div>` : ''}
    <div class="row" style="margin:14px 0 8px;justify-content:space-between"><h3 style="margin:0;flex:none">Productos</h3>
      <label style="flex:none;white-space:nowrap;display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="vcos" style="width:auto" ${V.verCostos ? 'checked' : ''}> Ver costos</label></div>
    <div class="chips">${top.map(chip).join('')}${otros.length ? `<button class="chip ghost" id="votros">${V.verOtros ? '− Menos' : '+ Otros (' + otros.length + ')'}</button>` : ''}</div>
    ${V.verOtros ? `<div class="chips" style="margin-top:8px">${otros.map(chip).join('')}</div>` : ''}
    <div class="pcards" style="margin-top:12px">${V.lineas.map((l, i) => `<div class="pcard">
      <div class="top"><b>${esc(l.nombre)}</b><span><span class="num" data-st="${i}"></span><button class="x" data-rm="${i}" title="Quitar">×</button></span></div>
      <div class="flds ${V.verCostos ? 'c3' : ''}">
        <div><label>Kg</label><input class="num big" inputmode="decimal" data-i="${i}" data-f="kg" value="${esc(l.kg)}" placeholder="0"></div>
        ${V.verCostos ? `<div><label>Costo</label><input class="num big" inputmode="decimal" data-i="${i}" data-f="costo" value="${esc(l.costo)}"></div>` : ''}
        <div><label>Precio $/kg</label><input class="num big" inputmode="decimal" data-i="${i}" data-f="precio" value="${esc(l.precio)}"></div>
      </div>
      ${S.movimientos && S.movimientos.length && num(l.kg) > Number(((S.productos.find(p => p.Codigo === l.codigo) || {}).Stock) || 0) ? `<div class="small" style="color:var(--bad);margin-top:4px">⚠️ En inventario hay ${n2((S.productos.find(p => p.Codigo === l.codigo) || {}).Stock)} kg</div>` : ''}
      <div class="small" data-pw="${i}" style="color:var(--bad);margin-top:4px"></div>
      ${l.previo && num(l.previo) !== num(l.precio) ? `<div class="small muted" style="margin-top:4px">La vez pasada: ${n2(l.previo)} · <a href="#" data-prev="${i}">usar ese precio</a></div>` : ''}
    </div>`).join('') || '<div class="empty small" style="grid-column:1/-1">Toca los productos que lleva el cliente o usa "Repetir último pedido".</div>'}</div>
    ${V.lineas.length ? `<label style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="vap" style="width:auto" ${V.actualizarPrecios ? 'checked' : ''}> Guardar estos precios como precios de lista</label>` : ''}
    <div style="margin-top:10px" id="vtot"></div>
    <h3>Pago</h3>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="vpa" style="width:auto" ${V.pago.activo ? 'checked' : ''}> El cliente ya pagó (total o una parte)</label>
    ${V.pago.activo ? pagoCampos(V.pago, tasa, 'vp') : `<p class="small muted">Queda a crédito, vence el ${fdate(addDays(V.fecha, dias))} (${dias} días).</p>`}
    <div class="row" style="margin-top:12px"><div style="flex:3"><label>Notas</label><input id="vno" value="${esc(V.notas)}"></div></div>
    <div class="row" style="margin-top:14px"><button class="btn sec" id="vlimpiar" style="flex:none">Limpiar</button><button class="btn acc" id="vg">Guardar venta</button></div>
  </div>`;
  const pintarTot = () => {
    let t = 0, c = 0, k = 0;
    V.lineas.forEach((l, i) => { const kg = num(l.kg); t += kg * num(l.precio); c += kg * num(l.costo); k += kg; const el = document.querySelector(`[data-st="${i}"]`); if (el) el.textContent = kg ? usd(kg * num(l.precio)) : '';
      const w = document.querySelector(`[data-pw="${i}"]`); if (w) w.textContent = num(l.costo) > 0 && num(l.precio) > 0 && num(l.precio) < num(l.costo) ? `⚠️ Vas a vender por debajo del costo (${n2(l.costo)}/kg): pierdes ${usd((num(l.costo) - num(l.precio)) * (kg || 1))}${kg ? '' : ' por kg'}` : ''; });
    $('#vtot').innerHTML = !V.lineas.length ? '' : `<div class="tot"><span>Kilos</span><span class="num">${n2(k)} kg</span></div>
      <div class="tot"><span>Utilidad</span><span class="num" style="color:var(--ok)">${usd(t - c)} ${t ? `<small class="muted">(${Math.round((t - c) / t * 100)}%)</small>` : ''}</span></div>
      <div class="tot big"><span>Total</span><span class="num">${usd(t)}${tasa ? `<br><small class="muted">${bs(t * tasa)}</small>` : ''}</span></div>`;
  };
  pintarTot();
  const rer = (focoCod) => { const y = window.scrollY; vVender(); window.scrollTo(0, y); if (focoCod) { const i = V.lineas.findIndex(l => l.codigo === focoCod); const el = document.querySelector(`[data-i="${i}"][data-f="kg"]`); if (el) el.focus(); } };
  document.querySelectorAll('[data-i]').forEach(el => el.oninput = () => { V.lineas[el.dataset.i][el.dataset.f] = el.value; pintarTot(); });
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { agregarLinea(V, b.dataset.add); rer(b.dataset.add); });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { V.lineas.splice(b.dataset.rm, 1); rer(); });
  document.querySelectorAll('[data-prev]').forEach(a => a.onclick = e => { e.preventDefault(); const l = V.lineas[a.dataset.prev]; l.precio = String(l.previo); rer(); });
  const ov = $('#votros'); if (ov) ov.onclick = () => { V.verOtros = !V.verOtros; rer(); };
  const repetir = (venta) => {
    S.detalle.filter(d => d.VentaID === venta.ID).forEach(d => { V.lineas = V.lineas.filter(l => l.codigo !== d.Codigo); agregarLinea(V, d.Codigo, d.Kg, d.Precio); });
    toast('Pedido cargado: ajusta los kilos si cambió algo'); rer();
  };
  const rp = $('#vrep'); if (rp) rp.onclick = () => repetir(ult);
  const bu = $('#vbus'); if (bu) bu.onclick = async () => {
    V.buscando = true; rer();
    try { mergeS(await call('historial', { cliente: V.cliente })); const u = ultimaVenta(V.cliente); V.buscando = false; if (u) repetir(u); else { toast('Este cliente no tiene pedidos anteriores'); rer(); } }
    catch (e) { V.buscando = false; toast(e.message, true); rer(); }
  };
  $('#vc').onchange = e => { V.cliente = e.target.value.trim(); V.direccion = null; setTimeout(vVender); };
  $('#vf').onchange = e => { V.fecha = e.target.value; rer(); };
  $('#vn').oninput = e => V.nota = e.target.value;
  const vd = $('#vdir'); if (vd) vd.oninput = e => V.direccion = e.target.value;
  $('#vno').oninput = e => V.notas = e.target.value;

  const ap = $('#vap'); if (ap) ap.onchange = e => V.actualizarPrecios = e.target.checked;
  $('#vpa').onchange = e => { V.pago.activo = e.target.checked; rer(); };
  if (V.pago.activo) bindPago(V.pago, 'vp', rer);
  $('#vlimpiar').onclick = () => { VENTA = null; vVender(); };
  const cp = $('#vcanped'); if (cp) cp.onclick = ev => { ev.preventDefault(); VENTA = null; TAB = 'pedidos'; render(); };
  $('#vg').onclick = e => busy(e.target, async () => {
    const lineas = V.lineas.filter(l => num(l.kg) > 0).map(l => ({ codigo: l.codigo, kg: num(l.kg), precio: num(l.precio), costo: num(l.costo) }));
    if (!V.cliente) throw new Error('Elige el cliente');
    if (!lineas.length) throw new Error('Escribe los kilos de al menos un producto');
    const sinStock = lineas.filter(l => l.kg > Number(((S.productos.find(p => p.Codigo === l.codigo) || {}).Stock) || 0) + 0.001);
    if (sinStock.length && S.movimientos && S.movimientos.length && !e.target.dataset.okst) { e.target.dataset.okst = 1; throw new Error('El inventario no alcanza para: ' + sinStock.map(l => nombreProd(l.codigo)).join(', ') + '. Si igual lo despachaste, toca Guardar otra vez.'); }
    const bajo = lineas.filter(l => l.costo > 0 && l.precio < l.costo);
    if (bajo.length && !e.target.dataset.okbc) { e.target.dataset.okbc = 1; throw new Error('⚠️ Precio por debajo del costo: ' + bajo.map(l => nombreProd(l.codigo) + ' (' + n2(l.precio) + ' < ' + n2(l.costo) + ')').join(', ') + '. Si es correcto, toca Guardar otra vez.'); }
    const r = await call('guardarVenta', { fecha: V.fecha, cliente: V.cliente, nota: V.nota ? num(V.nota) : null, lineas, notas: V.notas, actualizarPrecios: V.actualizarPrecios, pedidoId: V.pedidoId || '' });
    const c2 = S.clientes.find(c => c.Nombre === V.cliente) || { Nombre: V.cliente, DiasCredito: 7 };
    if ((V.direccion || '') !== (c2.Direccion || '')) await call('guardarCliente', Object.assign({}, c2, { original: V.cliente, Direccion: V.direccion || '' }));
    if (V.pago.activo && num(V.pago.monto) > 0) await call('guardarCobro', cobroPayload(V.pago, V.cliente, V.fecha, r.id));
    toast(`Venta nota ${r.nota} guardada · ${usd(r.total)}`);
    VENTA = null; await recargar();
  });
}

    <div><label>Moneda</label><div class="seg"><button class="${P.moneda === 'Bs' ? 'on plain' : ''}" data-${px}mon="Bs">Bs</button><button class="${P.moneda === 'USD' ? 'on plain' : ''}" data-${px}mon="USD">$</button></div></div>
    <div><label>Monto ${P.moneda === 'Bs' ? 'Bs' : '$'}</label><input id="${px}v" class="num" inputmode="decimal" value="${esc(P.monto)}" placeholder="0,00"></div>

    <div><label>Referencia (opcional)</label><input id="${px}r" value="${esc(P.referencia)}" placeholder="últimos 4"></div>
    <div style="grid-column:span 2"><label>&nbsp;</label><label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="${px}pl" style="width:auto" ${porLocalDe(P) ? 'checked' : ''}> Entró por las cuentas del local (punto o pago móvil del local)</label></div>
  </div>`;
}
function porLocalDe(P) { return P.porLocal != null ? P.porLocal : /móvil|Punto/.test(P.metodo); }
function bindPago(P, px, rer) {
  $('#' + px + 'm').onchange = e => { P.metodo = e.target.value; P.porLocal = null; if (/Efectivo \$|Zelle/.test(P.metodo)) P.moneda = 'USD'; rer(); };
  $('#' + px + 'b').onchange = e => P.banco = e.target.value;
  document.querySelectorAll(`[data-${px}mon]`).forEach(b => b.onclick = () => { P.moneda = b.getAttribute('data-' + px + 'mon'); rer(); });
  const upd = () => { const eqEl = $('#' + px + 'eq'); if (eqEl) { const t = num(P.tasa || ($('#' + px + 't') || {}).value); eqEl.textContent = usd(t ? num(P.monto) / t : 0); } };
  $('#' + px + 'v').oninput = e => { P.monto = e.target.value; upd(); };
  const t = $('#' + px + 't'); if (t) t.oninput = e => { P.tasa = e.target.value; upd(); };
  $('#' + px + 'r').oninput = e => P.referencia = e.target.value;
  $('#' + px + 'pl').onchange = e => P.porLocal = e.target.checked;
}
function cobroPayload(P, cliente, fecha, ventaId) {
  const tasa = P.moneda === 'Bs' ? num(P.tasa || tasaPara(fecha)) : null;
  return { fecha, cliente, ventaId: ventaId || '', metodo: P.metodo, banco: P.banco, referencia: P.referencia, notas: P.notas || '',
    montoBs: P.moneda === 'Bs' ? num(P.monto) : 0, montoUSD: P.moneda === 'USD' ? num(P.monto) : 0, tasa, porLocal: porLocalDe(P) };
}

/* ===== SUBIR VENTAS ANTERIORES (Excel) ===== */
let IMPORT = null, IMPORT_ABIERTO = false;
const LOTE = 300;
function cargarXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = LIB + LIBS.xlsx; sc.onload = ok; sc.onerror = () => fail(new Error('No se pudo cargar el lector de Excel. Revisa la conexión e intenta otra vez.')); document.head.appendChild(sc); });
}
const normTxt = t => String(t == null ? '' : t).trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
const pad2 = n => String(n).padStart(2, '0');
/** Fecha de Excel (fecha, número de serie o texto dd/mm/aaaa) → aaaa-mm-dd. */
function fechaISO(v) {
  if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() + 12 * 3600e3); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  if (typeof v === 'number' && v > 20000 && v < 80000 && window.XLSX) { const p = XLSX.SSF.parse_date_code(v); return p.y + '-' + pad2(p.m) + '-' + pad2(p.d); }
  const t = String(v || '').trim(); let m;
  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  if ((m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  return '';
}
const numX = v => typeof v === 'number' ? v : num(String(v || '').replace(/[$\s]/g, ''));
function buscarProd(t) { const n = normTxt(t); return S.productos.find(p => normTxt(p.Codigo) === n || normTxt(p.Nombre) === n) || S.productos.find(p => n.length >= 4 && normTxt(p.Nombre).startsWith(n)); }

/** Lee el Excel: formato viejo (VENTAS: NOMBRES, FECHA, KG RIC…) o la plantilla (una fila por producto). */
function leerVentasExcel(buf) {

/** Excel del Kiosco: varias filas por día (una por cierre del punto), la fecha solo en la primera.

function leerKiosco(rows, hi, H) {
  const ix = n => H.indexOf(n), cF = ix('FECHA'), cC = ix('CIERRE'), cB = ix('BANCO BS'), cD = ix('DIF'), cP = ix('PAGO MOVIL'), cT = ix('TASA'), cU = H.indexOf('$');
  const dias = new Map(), avisos = []; let fecha = '', tasaPrev = 0, sinFecha = 0, sinTasa = 0;
  rows.slice(hi + 1).forEach((r, k) => {
    const f = r[cF] instanceof Date ? fechaISO(r[cF]) : '';
    if (f) fecha = f; else if (r[cF] !== '' && r[cF] != null) fecha = ''; // "LUNES", "MARTES"…: fecha incompleta
    const pdv = numX(r[cC]) || numX(r[cB]), pm = numX(r[cP]), usdE = cU >= 0 ? numX(r[cU]) : 0, com = cD >= 0 ? numX(r[cD]) : 0;

    if (!fecha) { sinFecha++; return; }
    if (!tasa) { tasa = tasaPrev; sinTasa++; } else tasaPrev = tasa;
    const d = dias.get(fecha) || { fila: hi + k + 2, fecha, moneda: 'Bs', pdv: 0, pm: 0, efe: 0, efeUsd: 0, mayor: 0, tasa: 0, com: 0 };
    d.pdv += pdv; d.pm += pm; d.efeUsd += usdE; d.com += com; if (!d.tasa && tasa) d.tasa = tasa; dias.set(fecha, d);

  if (sinTasa) avisos.push(`${sinTasa} fila(s) sin tasa: se usó la tasa de la fila anterior`);

}

      const H = rows[hi].map(normTxt), ix = {}; Object.entries(al).forEach(([k, ns]) => { ix[k] = H.findIndex(h => ns.includes(h)); });
      if (['FECHA', 'CIERRE', 'PAGO MOVIL', 'TASA'].every(h => H.includes(h))) return leerKiosco(rows, hi, H);
      if (ix.fecha < 0 || (ix.pdv < 0 && ix.pm < 0 && ix.efe < 0)) continue;
      const avisos = [], cierres = [], g = (r, k) => ix[k] >= 0 ? r[ix[k]] : '';
      rows.slice(hi + 1).forEach((r, k) => { const fila = hi + k + 2, fecha = fechaISO(g(r, 'fecha'));
        const x = { fila, fecha, moneda: /^\$|USD|DOLAR/.test(normTxt(g(r, 'moneda'))) ? 'USD' : 'Bs', pdv: numX(g(r, 'pdv')), pm: numX(g(r, 'pm')), efe: numX(g(r, 'efe')), mayor: numX(g(r, 'mayor')), tasa: numX(g(r, 'tasa')), notas: String(g(r, 'notas') || '').trim() };
        if (!fecha && !(x.pdv + x.pm + x.efe + x.mayor)) return;
        if (!fecha) return avisos.push(`Fila ${fila}: sin fecha, se salta`);
        if (!(x.pdv + x.pm + x.efe + x.mayor > 0)) return avisos.push(`Fila ${fila} (${fdate(fecha)}): sin montos, se salta`);
        cierres.push(x); });
      if (ix.moneda < 0) avisos.unshift('No hay columna Moneda: se asume que todo está en bolívares');
      return { cierres, avisos };
    }
  }
  throw new Error('No reconocí el archivo. Debe tener una columna Fecha y al menos Punto de venta, Pago móvil o Efectivo. Usa la plantilla.');
}

/** Margen real de cada producto en los últimos 90 días vs su objetivo; los que dejan menos, arriba. */
function margenesCard() {
  const c90 = addDays(hoy(), -90), ids = new Set(ventasActivas().filter(v => v.Fecha >= c90).map(v => v.ID)), m = {};
  S.detalle.filter(d => ids.has(d.VentaID)).forEach(d => { const x = m[d.Codigo] = m[d.Codigo] || { v: 0, u: 0, kg: 0 }; x.v += Number(d.Subtotal); x.u += Number(d.Utilidad); x.kg += Number(d.Kg); });
  const filas = Object.entries(m).filter(([, x]) => x.v > 0).map(([cod, x]) => { const p = S.productos.find(q => q.Codigo === cod) || {}; return { nombre: p.Nombre || cod, mg: x.u / x.v, obj: Number(p.Margen) || 0, v: x.v, kg: x.kg, bajo: Number(p.Precio) > 0 && Number(p.Precio) < Number(p.Costo) }; }).sort((a, b) => a.mg - b.mg);
  if (!filas.length) return '';
  return `<details class="card" ${filas.some(f => f.bajo || f.mg < f.obj - 0.03) ? 'open' : ''}><summary><h2 style="margin:0">Margen por producto · últimos 90 días ▾</h2></summary>
    <div class="tbl" style="margin-top:10px"><table><tr><th>Producto</th><th class="r">Kg</th><th class="r">Ventas</th><th class="r">Margen</th><th class="r hm">Objetivo</th></tr>

/* ===== Selector de productos con kg (compartido) ===== */
// lineas: [{codigo, kg, ...}] · opts: { stock: bool, agotados: {codigo:true}, precio: fn(p) }
function chipsProductos(lineas, opts) {
  opts = opts || {};
  const usados = new Set(lineas.map(l => l.codigo));
  const prods = (opts.productos || productosPorUso());
  return `<div class="chips">${prods.map(p => {
    const off = opts.agotados && opts.agotados[p.Codigo];
    const st = opts.stock ? ` <small class="muted">${n2(Number(S.disponible ? S.disponible[p.Codigo] : p.Stock) || 0)} kg</small>` : '';
    return `<button class="chip ${usados.has(p.Codigo) ? 'on' : ''} ${off ? 'off' : ''}" data-pk="${p.Codigo}" ${off ? 'disabled title="Agotado"' : ''}>${usados.has(p.Codigo) ? '✓ ' : '+ '}${esc(p.Nombre)}${off ? ' · agotado' : st}</button>`;
  }).join('')}</div>`;
}
function nombreProd(cod) { const p = (S.productos || []).find(x => x.Codigo === cod); return p ? p.Nombre : cod; }

/* ===== INVENTARIO (admin) ===== */
let ENTRADA = null, TRASLADO = null;
function margenDe(costo, precio) { return precio > 0 ? (precio - costo) / precio : 0; }
function precioCon(costo, margen) { return margen < 1 ? costo / (1 - margen) : 0; }
const pct = m => (Math.round(m * 1000) / 10).toLocaleString('es-VE') + '%';
function invStock() {
  const prods = S.productos.filter(p => String(p.Activo).toUpperCase() !== 'NO');

  const valor = prods.reduce((s, p) => s + Math.max(0, Number(p.Stock) || 0) * (Number(p.Costo) || 0), 0);
  const bajos = prods.filter(p => Number(p.Minimo) > 0 && Number(p.Stock) < Number(p.Minimo));
  const sinConteo = !S.movimientos.some(m => m.Tipo === 'Inventario inicial') && prods.every(p => !Number(p.Stock));
  $('#inv').innerHTML = `${sinConteo ? '<div class="banner warn">📦 Todavía no hay inventario cargado. Empieza por <b>Conteo</b>: pesa lo que hay y escribe los kg de cada producto.</div>' : ''}
    <div class="grid g3" style="margin-bottom:14px">
      <div class="kpi"><small>Kilos en inventario</small><b>${n2(prods.reduce((s, p) => s + Math.max(0, Number(p.Stock) || 0), 0))}</b></div>
      <div class="kpi"><small>Valor al costo</small><b>${usd(valor)}</b></div>
      <div class="kpi ${bajos.length ? 'bad' : ''}"><small>Bajo el mínimo</small><b>${bajos.length}</b></div></div>
    <div class="card"><div class="tbl"><table>
      <tr><th>Producto</th><th class="r">Stock<span class="hm"> kg</span></th><th class="r">Reserv<span class="hm">ado</span></th><th class="r">Dispon<span class="hm">ible</span></th><th class="r hm">Mínimo</th><th class="r hm">Costo</th><th class="r hm">Precio</th><th class="r">Margen</th></tr>
      ${prods.map(p => { const st = Number(p.Stock) || 0, mi = Number(p.Minimo) || 0, m = margenDe(Number(p.Costo), Number(p.Precio)), obj = Number(p.Margen) || 0;
        return `<tr><td>${esc(p.Nombre)} ${mi && st < mi ? '<span class="pill p-bad">bajo</span>' : ''}</td><td class="r num"><b>${n2(st)}</b></td><td class="r num muted">${reservado(p.Codigo) ? n2(reservado(p.Codigo)) : ''}</td><td class="r num">${n2(S.disponible[p.Codigo])}</td>
          <td class="r num muted hm">${mi ? n2(mi) : ''}</td><td class="r num hm">${n2(p.Costo)}</td><td class="r num hm">${n2(p.Precio)}</td>
          <td class="r num" style="color:${m < obj - 0.03 ? 'var(--bad)' : 'var(--ok)'}" title="Objetivo ${pct(obj)}">${pct(m)}</td></tr>`; }).join('')}
    </table></div><p class="small muted">"Reservado" son kg de pedidos de clientes todavía sin confirmar. El margen sale en rojo si está más de 3 puntos por debajo del objetivo del producto (Ajustes → Productos).</p></div>
    <div class="card"><h2>Ajuste rápido (merma, queso dañado, devolución)</h2>
      <div class="row"><div><label>Producto</label><select id="ajp">${prods.map(p => `<option value="${p.Codigo}">${esc(p.Nombre)}</option>`).join('')}</select></div>

        <div style="flex:2"><label>Motivo</label><input id="ajm" placeholder="Ej: queso dañado"></div><button class="btn" id="ajg" style="flex:none">Guardar</button></div></div>`;

    const el = document.querySelector(`[data-ei="${E.lineas.length - 1}"][data-ef="kg"]`); if (el) el.focus();

  document.querySelectorAll('[data-erm]').forEach(b => b.onclick = () => { E.lineas.splice(b.dataset.erm, 1); rer(); });

  });

/* ===== V11: ventana flotante ===== */
function modal(html, bind) {
  cerrarModal();
  const velo = document.createElement('div'), d = document.createElement('div'); velo.className = 'velo osc'; d.className = 'modal';
  d.innerHTML = `<button class="x mx" id="mx" title="Cerrar">×</button>${html}`; document.body.append(velo, d); velo.onclick = cerrarModal; d.querySelector('#mx').onclick = cerrarModal;
  document.addEventListener('keydown', escModal); if (bind) bind(d); return d;
}
function cerrarModal() { document.querySelectorAll('.modal,.velo').forEach(x => x.remove()); document.removeEventListener('keydown', escModal); }
function escModal(e) { if (e.key === 'Escape' && document.getElementById('mx')) cerrarModal(); }
const cobradoDe = id => r2(S.cobros.filter(c => c.VentaID === id).reduce((s, c) => s + Number(c.MontoUSD || 0), 0));

    d.querySelector('#mbody').innerHTML = `<h2 style="margin-right:30px">Corregir nota ${esc(v.Nota || 's/n')}</h2>
      <p class="small muted" style="margin-top:-6px">Cambia lo que esté mal. Los cobros se mantienen; el inventario se ajusta solo por la diferencia.</p>

      <h3>Productos</h3>

        ${E.lineas.map((l, i) => `<tr><td>${esc(nombreProd(l.codigo))}</td><td class="r"><input class="num" style="width:76px" inputmode="decimal" data-li="${i}" data-lf="kg" value="${esc(l.kg)}"></td><td class="r"><input class="num" style="width:76px" inputmode="decimal" data-li="${i}" data-lf="precio" value="${esc(l.precio)}"></td><td class="r num" data-ls="${i}">${usd(num(l.kg) * num(l.precio))}</td><td><button class="x" data-lx="${i}">×</button></td></tr>`).join('')}
      </table></div>
      <div class="row" style="margin-top:6px"><select id="eadd"><option value="">+ Agregar producto…</option>${S.productos.filter(p => String(p.Activo).toUpperCase() !== 'NO' && !E.lineas.some(l => l.codigo === p.Codigo)).map(p => `<option value="${p.Codigo}">${esc(p.Nombre)}</option>`).join('')}</select></div>
      <div class="tot"><span>Total antes</span><span class="num">${usd(v.Total)}</span></div>
      <div class="tot big"><span>Total corregido</span><span class="num" id="etot">${usd(tot)}</span></div>
      <div id="eav" class="small"></div>
      <label style="margin-top:8px">Motivo (queda en el registro)</label><input id="em" value="${esc(E.motivo)}" placeholder="Ej: se pesó mal, precio equivocado">
      <button class="btn acc full" style="margin-top:12px" id="eg">Guardar corrección</button>`;
    const aviso = () => { const t = E.lineas.reduce((s, l) => s + num(l.kg) * num(l.precio), 0); d.querySelector('#etot').textContent = usd(t);
      d.querySelector('#eav').innerHTML = cobrado - t > 0.005 ? `<div class="banner warn" style="margin-top:6px">Ya le cobraste ${usd(cobrado)}: los ${usd(cobrado - t)} de más quedan como <b>saldo a favor</b> del cliente.</div>` : ''; };

  modal('<div id="mbody"></div>', pinta);

/* ===== V11: devolución ===== */
function devolucionVenta(id) {
  const v = S.ventas.find(x => x.ID === id); if (!v) return;
  const L = S.detalle.filter(d => d.VentaID === id), dev = {}, E = { motivo: '', alInventario: true };
  modal(`<h2 style="margin-right:30px">Devolución · nota ${esc(v.Nota || 's/n')}</h2><p class="small muted" style="margin-top:-6px">${esc(v.Cliente)} · ${fdate(v.Fecha)}. Escribe los kilos que devolvió el cliente: se descuentan de la nota.</p>
    <div class="tbl"><table><tr><th>Producto</th><th class="r">Vendido</th><th class="r">Devuelve kg</th><th class="r">Monto</th></tr>
      ${L.map((d, i) => `<tr><td>${esc(d.Producto)}</td><td class="r num">${n2(d.Kg)} kg</td><td class="r"><input class="num" style="width:76px" inputmode="decimal" data-dk="${i}" placeholder="0"></td><td class="r num" data-dm="${i}"></td></tr>`).join('')}</table></div>
    <div class="tot big"><span>Se descuenta de la nota</span><span class="num" id="dtot">${usd(0)}</span></div>
    <label style="margin-top:8px">¿Qué pasa con la mercancía?</label>
    <div class="seg"><button class="on plain" data-ai="1">Vuelve al inventario (está buena)</button><button data-ai="0">Se bota (merma)</button></div>
    <label style="margin-top:8px">Motivo</label><input id="dmo" placeholder="Ej: venía agrio, no era lo que pidió">
    <button class="btn acc full" style="margin-top:12px" id="dg">Registrar devolución</button>`, d => {
    const tot = () => { let t = 0; L.forEach((x, i) => { const k = Math.min(num(dev[i] || 0), Number(x.Kg)); t += k * Number(x.Precio); d.querySelector(`[data-dm="${i}"]`).textContent = k ? usd(k * Number(x.Precio)) : ''; }); d.querySelector('#dtot').textContent = usd(t); };
    d.querySelectorAll('[data-dk]').forEach(el => el.oninput = () => { dev[el.dataset.dk] = el.value; tot(); });
    d.querySelectorAll('[data-ai]').forEach(b => b.onclick = () => { E.alInventario = b.dataset.ai === '1'; d.querySelectorAll('[data-ai]').forEach(x => x.className = x === b ? 'on plain' : ''); });
    d.querySelector('#dmo').oninput = e => E.motivo = e.target.value;
    d.querySelector('#dg').onclick = e => busy(e.target, async () => {
      const lineas = L.map((x, i) => ({ codigo: x.Codigo, kg: num(dev[i] || 0) })).filter(l => l.kg > 0);
      if (!lineas.length) throw new Error('Escribe los kilos devueltos');
      const r = await call('devolverVenta', { id, lineas, motivo: E.motivo, alInventario: E.alInventario });
      cerrarModal(); toast('Devolución registrada · ' + usd(r.devuelto) + (r.aFavor ? ' (' + usd(r.aFavor) + ' a favor del cliente)' : '')); await recargar();
    });
  });
}

let XL = null;
function vExcel() {
  const ex = S.exportes || [], h = hoy();
  if (!XL) { let g = {}; try { g = JSON.parse(localStorage.getItem('xl') || '{}'); } catch (e) {} XL = Object.assign({ tipo: (ex[0] || {}).k, periodo: 'mes', desde: h.slice(0, 8) + '01', hasta: h, cols: {}, anuladas: false }, g); }
  const t = ex.find(x => x.k === XL.tipo) || ex[0]; if (!t) return $('#main').innerHTML = '<div class="card empty">No hay datos para descargar.</div>';
  XL.tipo = t.k; const sel = XL.cols[t.k] || t.cols;
  const rango = () => { const m = h.slice(0, 7), pm = mesAnterior(m), fin = x => addDays((x.slice(5) === '12' ? (Number(x.slice(0, 4)) + 1) + '-01' : x.slice(0, 5) + String(Number(x.slice(5)) + 1).padStart(2, '0')) + '-01', -1);
    return { mes: [m + '-01', h], pasado: [pm + '-01', fin(pm)], tres: [mesAnterior(mesAnterior(m)) + '-01', h], anio: [h.slice(0, 4) + '-01-01', h], todo: ['2000-01-01', h], otro: [XL.desde, XL.hasta] }[XL.periodo]; };
  $('#main').innerHTML = `<div class="card" style="max-width:760px"><h2>Descargar en Excel</h2>
    <p class="small muted" style="margin-top:-6px">Elige qué datos, de qué fechas y qué columnas. Para archivos grandes, achica el período o quita columnas.</p>
    <label>¿Qué datos?</label><select id="xt">${ex.map(x => `<option value="${x.k}" ${x.k === t.k ? 'selected' : ''}>${esc(x.n)}</option>`).join('')}</select>
    ${t.fecha ? `<label style="margin-top:10px">Período</label><div class="seg wrap">${[['mes', 'Este mes'], ['pasado', 'Mes pasado'], ['tres', 'Últimos 3 meses'], ['anio', 'Este año'], ['todo', 'Todo'], ['otro', 'Elegir fechas']].map(([k, n]) => `<button class="${XL.periodo === k ? 'on plain' : ''}" data-xp="${k}">${n}</button>`).join('')}</div>
      ${XL.periodo === 'otro' ? `<div class="row" style="margin-top:8px"><div><label>Desde</label><input type="date" id="xd" value="${XL.desde}"></div><div><label>Hasta</label><input type="date" id="xh" value="${XL.hasta}"></div></div>` : `<p class="small muted" style="margin:6px 0 0">${XL.periodo === 'todo' ? 'Todos los años' : 'Del ' + fdate(rango()[0]) + ' al ' + fdate(rango()[1])}</p>`}` : '<p class="small muted" style="margin:10px 0 0">Foto de hoy (no depende de fechas).</p>'}
    ${t.k === 'ventas' ? `<label style="display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--ink)"><input type="checkbox" id="xa" style="width:auto" ${XL.anuladas ? 'checked' : ''}> Incluir notas anuladas</label>` : ''}
    <label style="margin-top:10px">Columnas <span class="small muted">(${sel.length} de ${t.cols.length}) · <a href="#" id="xall">todas</a> · <a href="#" id="xnone">ninguna</a></span></label>
    <div class="xcols">${t.cols.map(c => `<label><input type="checkbox" data-xc="${esc(c)}" ${sel.includes(c) ? 'checked' : ''}> ${esc(c)}</label>`).join('')}</div>
    <button class="btn acc" style="margin-top:14px" id="xg">⬇ Descargar Excel</button><div id="xr" class="small" style="margin-top:8px"></div></div>`;
  const guarda = () => { try { localStorage.setItem('xl', JSON.stringify(XL)); } catch (e) {} };
  $('#xt').onchange = e => { XL.tipo = e.target.value; guarda(); vExcel(); };
  document.querySelectorAll('[data-xp]').forEach(b => b.onclick = () => { XL.periodo = b.dataset.xp; guarda(); vExcel(); });
  const xd = $('#xd'); if (xd) { xd.onchange = e => { XL.desde = e.target.value; guarda(); }; $('#xh').onchange = e => { XL.hasta = e.target.value; guarda(); }; }
  const xa = $('#xa'); if (xa) xa.onchange = e => { XL.anuladas = e.target.checked; guarda(); };
  const leeCols = () => { XL.cols[t.k] = t.cols.filter(c => document.querySelector(`[data-xc="${c}"]`).checked); guarda(); };
  document.querySelectorAll('[data-xc]').forEach(c => c.onchange = () => { leeCols(); vExcel(); });
  $('#xall').onclick = e => { e.preventDefault(); XL.cols[t.k] = t.cols.slice(); guarda(); vExcel(); };
  $('#xnone').onclick = e => { e.preventDefault(); XL.cols[t.k] = []; guarda(); vExcel(); };
  $('#xg').onclick = e => busy(e.target, async () => {

    const [desde, hasta] = t.fecha ? rango() : ['', ''];

    const [r] = await Promise.all([call('exportar', { tipo: t.k, desde, hasta, columnas: sel, anuladas: XL.anuladas }), cargarXLSX()]);
    if (!r.filas.length) throw new Error('No hay datos en ese período');

    ws['!cols'] = r.columnas.map((c, i) => ({ wch: Math.min(40, Math.max(c.length + 2, ...r.filas.slice(0, 200).map(f => String(f[i] == null ? '' : f[i]).length + 1))) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, r.titulo.replace(/[\\/?*[\]:]/g, '').slice(0, 31));
    const nombre = r.titulo.replace(/[^\wáéíóúñ ]/gi, '').replace(/\s+/g, '_') + (t.fecha ? '_' + desde + '_a_' + hasta : '_' + h) + '.xlsx';
    XLSX.writeFile(wb, nombre);
    $('#xr').innerHTML = `✅ ${r.filas.length} fila(s) descargadas en <b>${esc(nombre)}</b>.${r.recortado ? ` <span style="color:var(--bad)">Eran ${r.total}: se recortó a ${r.filas.length}. Achica el período.</span>` : ''}`;
  });
}

      <textarea id="dpago" rows="4" placeholder="Pago móvil: Banco ... · 0414-0000000 · V-00000000&#10;Zelle: 00000000">${esc(S.datosPago || '')}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="dpg" style="flex:none">Guardar</button><button class="btn sec" id="dpv" style="flex:none">Ver mensaje de ejemplo</button></div>
      <pre id="dpej" class="small hide" style="white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0 0;font-family:inherit"></pre></div>
    <div class="card"><h2>Aviso de privacidad (clientes)</h2>
      <p class="small muted" style="margin-top:-6px">Lo ve cada cliente la primera vez que entra y debe tocar «Acepto». Queda constancia de cuándo lo aceptó (columna Privacidad en Usuarios). Si cambias el texto, todos lo vuelven a aceptar. {NEGOCIO} se reemplaza por el nombre del negocio. Es un texto general: si tienes dudas legales, consúltalo con un abogado.</p>
      <textarea id="apv" rows="6">${esc(S.avisoPrivacidad || '')}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="apg" style="flex:none">Guardar aviso</button></div></div>
    ${F('cierreMes') ? `<div class="card"><h2>Cerrar mes</h2>
      <p class="small muted" style="margin-top:-6px">Cuando un mes ya está revisado, ciérralo: nadie podrá registrar, corregir ni borrar ventas, cobros, cierres, compras o gastos con fecha de ese mes o anteriores. Se puede reabrir.</p>
      <p class="small">Cerrado hasta: <b>${S.cierreHasta ? mesNombre(S.cierreHasta) : 'ningún mes'}</b></p>
      <div class="row"><div><label>Cerrar hasta (incluido)</label><select id="cmh">${mesesLista().filter(m => m < hoy().slice(0, 7)).slice(0, 18).map(m => `<option value="${m}" ${m === S.cierreHasta ? 'selected' : ''}>${mesNombre(m)}</option>`).join('')}</select></div></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="cmg" style="flex:none">Cerrar</button>${S.cierreHasta ? '<button class="btn sec" id="cmr" style="flex:none">Reabrir todo</button>' : ''}</div></div>` : ''}
    <div class="card"><h2>Respaldo</h2>
      <p class="small muted" style="margin-top:-6px">Cada domingo en la noche se guarda una copia completa de la hoja en Drive, en la carpeta "Respaldos …" junto a la hoja. Se guardan las últimas 8.</p>
      <p class="small">Último respaldo: <b>${S.respaldo ? esc(S.respaldo) : 'todavía ninguno'}</b></p>
      <button class="btn sec" id="resp">Hacer un respaldo ahora</button></div>
    <div class="card"><h2>Alertas y cuenta</h2>
      <p class="small muted">Todos los días a las 7 a.m. llega un correo a los administradores que tengan correo en Usuarios: deudas vencidas, cierre faltante, conciliación, inventario bajo, pedidos por confirmar y pagos a proveedores por vencer. Los pedidos y pagos de clientes avisan al momento.</p>
      <div class="row"><button class="btn sec" id="al">Enviar resumen ahora</button><button class="btn bad" id="lo">Cerrar sesión</button></div><p class="small muted" style="margin:10px 0 0">Pantalla ${PANTALLA} · servidor V${USER.version || '?'}</p></div>
  </div>`;
  $('#tg').onclick = e => busy(e.target, async () => { await call('guardarTasa', { fecha: $('#tf').value, tasa: num($('#tv').value) }); toast('Tasa guardada'); await recargar(); });
  $('#tb').onclick = e => busy(e.target, async () => { const r = await call('buscarTasa'); toast(r.sinCambio ? 'Hay una tasa manual para ese día; se mantiene' : 'Tasa BCV: ' + n2(r.tasa)); await recargar(); });
  const codDe = t => { t = t.trim(); const p = S.productos.find(x => x.Nombre.toLowerCase() === t.toLowerCase() || x.Codigo === t.toUpperCase()); return p ? p.Codigo : t; };
  document.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => busy(b, async () => { const c = b.dataset.ps; await call('guardarProducto', { Codigo: c, Nombre: $(`[data-pn="${c}"]`).value, Costo: num($(`[data-pc="${c}"]`).value), Precio: num($(`[data-pp="${c}"]`).value),
    Margen: $(`[data-pm="${c}"]`).value === '' ? '' : num($(`[data-pm="${c}"]`).value) / 100, Minimo: num($(`[data-pmin="${c}"]`).value), Sustitutos: $(`[data-psu="${c}"]`).value.split(',').map(codDe).filter(Boolean).join(',') }); toast('Producto actualizado'); await recargar(); }));
  const pintarUs = () => {
    const rows = S.usuarios.concat([{ nuevo: true, Nombre: '', Usuario: '', Rol: 'empleado', Email: '', Activo: 'SI', Cliente: '' }]);
    $('#utab').innerHTML = '<tr><th>Nombre</th><th>Usuario</th><th>PIN nuevo</th><th>Rol</th><th>Cliente</th><th>Correo</th><th>Activo</th><th>Último ingreso</th><th></th></tr>' + rows.map((u, i) => `<tr>
      <td><input data-un="${i}" value="${esc(u.Nombre)}" placeholder="${u.nuevo ? 'Nuevo usuario' : ''}" style="min-width:110px"></td><td><input data-uu="${i}" value="${esc(u.Usuario)}" autocapitalize="none" style="min-width:90px"></td>
      <td><input data-up="${i}" class="mono" inputmode="numeric" maxlength="8" placeholder="${u.nuevo ? 'PIN' : '••••'}" style="width:80px"></td>
      <td><select data-ur="${i}" style="min-width:112px">${['admin', 'empleado', 'cliente', 'otro'].map(r => `<option value="${r}" ${String(u.Rol).toLowerCase() === r ? 'selected' : ''}>${r === 'otro' ? esc(S.perfilOtro || 'otro') : r}</option>`).join('')}</select></td>
      <td><input data-uc="${i}" list="dl-cli3" value="${esc(u.Cliente)}" style="min-width:150px"></td><td><input data-ue="${i}" value="${esc(u.Email)}" style="min-width:150px"></td>
      <td><select data-ua="${i}" style="min-width:70px"><option ${String(u.Activo).toUpperCase() !== 'NO' ? 'selected' : ''}>SI</option><option ${String(u.Activo).toUpperCase() === 'NO' ? 'selected' : ''}>NO</option></select></td>
      <td class="small" style="white-space:nowrap">${u.nuevo ? '' : (u.UltimoIngreso ? esc(String(u.UltimoIngreso).replace('T', ' ').slice(0, 16)) : '<span class="muted">nunca</span>') + (u.PinCifrado === false ? '<div style="color:var(--bad)">PIN sin cifrar</div>' : '')}</td>
      <td style="white-space:nowrap"><button class="btn sm ${u.nuevo ? '' : 'sec'}" data-ug="${i}" data-orig="${esc(u.Usuario || '')}">${u.nuevo ? '+' : '✓'}</button>${u.nuevo ? '' : ` <button class="btn sm sec" data-ub="${esc(u.Usuario || '')}" title="Quitar el bloqueo por PIN equivocado">🔓</button>`}</td></tr>`).join('') + `<datalist id="dl-cli3">${S.clientes.map(c => `<option value="${esc(c.Nombre)}">`).join('')}</datalist>`;
    document.querySelectorAll('[data-ug]').forEach(b => b.onclick = () => busy(b, async () => { const i = b.dataset.ug, v = k => $(`[data-${k}="${i}"]`).value;
      const propio = b.dataset.orig && b.dataset.orig === USR, nuevoPin = v('up').trim();
      await call('guardarUsuario', { original: b.dataset.orig, Nombre: v('un'), Usuario: v('uu'), PIN: nuevoPin, Rol: v('ur'), Cliente: v('uc'), Email: v('ue'), Activo: v('ua') });
      if (propio) { USR = v('uu').trim().toLowerCase(); store('usr', USR); if (nuevoPin) { await reentrar(nuevoPin); } } // tu propio usuario: se entra de nuevo con el PIN nuevo
      toast(propio && nuevoPin ? 'Tu PIN quedó cambiado' : 'Usuario guardado'); await recargar(); TAB = 'ajustes'; render(); }));
  };
  pintarUs();
  document.querySelectorAll('[data-ub]').forEach(b => b.onclick = () => busy(b, async () => { await call('desbloquear', { usuario: b.dataset.ub }); toast(b.dataset.ub + ' desbloqueado: ya puede volver a intentar'); }));
  $('#npg').onclick = e => busy(e.target, async () => { const n = $('#npn').value.trim(); if (!n) throw new Error('Escribe el nombre'); const cod = n.normalize('NFD').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() + (S.productos.length + 1); await call('guardarProducto', { Codigo: cod, Nombre: n, Costo: num($('#npc').value), Precio: num($('#npp').value) }); toast('Producto agregado'); VENTA = null; await recargar(); });
  const pintarCli = () => { const q = $('#cq').value.toLowerCase(); $('#ctab').innerHTML = '<tr><th>Nombre</th><th>Cédula / RIF</th><th>Teléfono</th><th>Dirección</th><th>Zona</th><th class="r">Días</th><th></th></tr>' + S.clientes.filter(c => !q || String(c.Nombre).toLowerCase().includes(q)).map((c, i) => `<tr><td><input value="${esc(c.Nombre)}" data-cn="${i}" style="min-width:200px"></td><td><input value="${esc(c.Documento || '')}" data-cdoc="${i}" placeholder="V- / J-" style="min-width:110px"></td><td><input value="${esc(c.Telefono)}" data-ct="${i}" inputmode="tel" style="min-width:110px"></td><td><input value="${esc(c.Direccion || '')}" data-cdir="${i}" style="min-width:160px"></td><td><input value="${esc(c.Zona)}" data-cz="${i}"></td><td><input class="num" style="width:56px" value="${esc(c.DiasCredito)}" data-cd="${i}"></td><td><button class="btn sm sec" data-cs="${i}" data-orig="${esc(c.Nombre)}">✓</button></td></tr>`).join('');
    document.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => busy(b, async () => { const i = b.dataset.cs; await call('guardarCliente', { original: b.dataset.orig, Nombre: $(`[data-cn="${i}"]`).value.trim(), Telefono: $(`[data-ct="${i}"]`).value, Zona: $(`[data-cz="${i}"]`).value, Direccion: $(`[data-cdir="${i}"]`).value, Documento: $(`[data-cdoc="${i}"]`).value.trim(), DiasCredito: num($(`[data-cd="${i}"]`).value) }); toast('Cliente guardado'); await recargar(); })); };
  $('#cq').oninput = pintarCli; pintarCli();
  $('#al').onclick = e => busy(e.target, async () => { const r = await call('enviarAlertas'); toast(r.enviado ? 'Correo enviado a ' + r.para.join(', ') : r.motivo, !r.enviado); });
  $('#lo').onclick = salir;
  $('#dpg').onclick = e => busy(e.target, async () => { await call('guardarConfig', { clave: 'DATOS_PAGO', valor: $('#dpago').value.trim() }); S.datosPago = $('#dpago').value.trim(); toast('Datos para cobrar guardados'); });
  $('#dpv').onclick = () => { const d0 = S.datosPago; S.datosPago = $('#dpago').value.trim(); const c = deudasPorCliente()[0] || { cliente: 'CLIENTE EJEMPLO', saldo: 100, notas: [{ Nota: 123, Fecha: hoy(), Vence: hoy(), Saldo: 100 }] };
    const pre = $('#dpej'); pre.textContent = msgCobro(c); pre.classList.remove('hide'); S.datosPago = d0; };
  document.querySelectorAll('[data-ira]').forEach(a => a.onclick = e => { e.preventDefault(); TAB = a.dataset.ira; render(); });
  const cmg = $('#cmg'); if (cmg) cmg.onclick = e => { if (!confirmar(e.target, '¿Cerrar ' + $('#cmh').value + '?')) return; busy(e.target, async () => { await call('cerrarMes', { hasta: $('#cmh').value }); toast('Mes cerrado'); await recargar(); }); };
  const cmr = $('#cmr'); if (cmr) cmr.onclick = e => { if (!confirmar(e.target, '¿Reabrir?')) return; busy(e.target, async () => { await call('cerrarMes', { hasta: '' }); toast('Meses reabiertos'); await recargar(); }); };
  const apg = $('#apg'); if (apg) apg.onclick = e => busy(e.target, async () => { await call('guardarConfig', { clave: 'AVISO_PRIVACIDAD', valor: $('#apv').value.trim() }); toast('Aviso guardado: los clientes lo verán al entrar'); await recargar(); });
  $('#resp').onclick = e => busy(e.target, async () => { const r = await call('respaldoAhora'); toast('Respaldo guardado: ' + r.nombre); S.respaldo = r.cuando; vAjustes(); });
  const unir = probar => call('unirClientes', { de: $('#ude').value.trim(), a: $('#ua').value.trim(), probar });
  const resumenU = r => Object.entries(r.cuenta).filter(([, n]) => n).map(([h, n]) => n + ' ' + ({ Ventas: 'venta(s)', Cobros: 'cobro(s)', Pedidos: 'pedido(s)', PagosReportados: 'pago(s) reportado(s)', CierreLineas: 'línea(s) de cierre', Usuarios: 'usuario(s)' }[h])).join(', ') || 'no tiene movimientos';
  $('#urev').onclick = e => busy(e.target, async () => { const r = await unir(true); $('#ures').innerHTML = `"<b>${esc(r.de)}</b>" → "<b>${esc(r.a)}</b>": se moverían ${resumenU(r)} y se borraría "${esc(r.de)}" de la lista.`; $('#ugo').classList.remove('hide'); });
  $('#ude').oninput = $('#ua').oninput = () => { $('#ugo').classList.add('hide'); $('#ures').textContent = ''; };
  $('#ugo').onclick = e => { if (!confirmar(e.target, '¿Seguro? No se deshace')) return; busy(e.target, async () => { const r = await unir(false); toast('Unidos: ' + r.de + ' → ' + r.a); await recargar(); }); };
}

start();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/googleusercontent|script\.google/.test(location.host)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}));
}
</script>
</body>
</html>
